<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Systems graph</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Systems graph</h1>
      <p>Peer clusters · YAML is the source of truth</p>
    </div>
    <div class="toolbar">
      <label class="search-label">Search
        <input type="search" id="search" placeholder="label or id" autocomplete="off" />
      </label>
      <button type="button" id="laterals">Laterals only</button>
      <button type="button" id="all-edges">All edge types</button>
      <button type="button" id="clear-focus">Clear focus</button>
      <button type="button" id="fit">Fit</button>
      <button type="button" id="relayout">Re-layout</button>
      <span id="status"></span>
    </div>
  </header>
  <div class="filters" id="filters">
    <fieldset>
      <legend>Kind</legend>
      <div id="kind-filters"></div>
    </fieldset>
    <fieldset class="cluster-box">
      <legend>Cluster</legend>
      <div class="filter-actions">
        <button type="button" id="clusters-all">All</button>
        <button type="button" id="clusters-none">None</button>
      </div>
      <div id="cluster-filters"></div>
    </fieldset>
    <fieldset>
      <legend>Edge type</legend>
      <div id="type-filters"></div>
    </fieldset>
  </div>
  <div id="wrap">
    <div id="cy"></div>
    <aside id="detail">
      <p class="empty">Click a node to focus its neighbourhood. Serve the repo root on a free high port, e.g. <code>python -m http.server 8765</code>, then open <code>/viewer/</code>.</p>
    </aside>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
