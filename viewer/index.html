<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Systems graph</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Systems graph</h1>
      <p>Peer clusters · YAML is the source of truth</p>
    </div>
    <div class="toolbar">
      <label class="search-label">Search
        <input type="search" id="search" placeholder="label or id" autocomplete="off" />
      </label>
      <div class="btn-group" role="group" aria-label="View">
        <button type="button" id="field" class="active">Field</button>
        <button type="button" id="open-interiors">Open interiors</button>
      </div>
      <div class="btn-group" role="group" aria-label="Query">
        <button type="button" id="path">Path</button>
        <button type="button" id="loop">Loop</button>
      </div>
      <div class="btn-group" role="group" aria-label="Findings">
        <button type="button" id="findings">Findings</button>
        <button type="button" id="new-findings">New</button>
      </div>
      <div class="btn-group" role="group" aria-label="Reading">
        <button type="button" id="sheet">Sheet</button>
        <button type="button" id="reading">Reading</button>
        <button type="button" id="slots">Slots</button>
        <button type="button" id="tours">Tours</button>
        <button type="button" id="hinges">Hinges</button>
      </div>
      <div class="btn-group" role="group" aria-label="Tests">
        <button type="button" id="communities">Communities</button>
        <button type="button" id="hide-platonic">Hide Platonic</button>
      </div>
      <div class="btn-group" role="group" aria-label="Canvas">
        <button type="button" id="clear-focus">Clear</button>
        <button type="button" id="fit">Fit</button>
        <button type="button" id="relayout">Layout</button>
      </div>
      <label class="search-label">Labels
        <select id="labels">
          <option value="auto" selected>auto</option>
          <option value="systems">systems</option>
          <option value="all">all</option>
          <option value="none">none</option>
        </select>
      </label>
      <button type="button" id="help">How to</button>
      <span id="status"></span>
    </div>
  </header>
  <div class="filters" id="filters">
    <fieldset>
      <legend>Kind</legend>
      <div id="kind-filters"></div>
    </fieldset>
    <fieldset>
      <legend>Edge type</legend>
      <div class="filter-actions">
        <button type="button" id="laterals">Laterals</button>
        <button type="button" id="all-edges">All types</button>
        <button type="button" id="heavy-pairs" class="active">Heavy</button>
        <button type="button" id="all-pairs">All pairs</button>
      </div>
      <div id="type-filters"></div>
    </fieldset>
    <details class="cluster-box" id="cluster-panel">
      <summary>Clusters</summary>
      <div class="filter-actions">
        <button type="button" id="clusters-all">All</button>
        <button type="button" id="clusters-none">None</button>
      </div>
      <div id="cluster-filters"></div>
    </details>
  </div>
  <div id="wrap">
    <div id="stage">
      <div id="cy"></div>
      <div id="sheet-view" hidden aria-label="Comparison sheet"></div>
      <div id="reading-view" hidden aria-label="Reading"></div>
      <p id="hover-readout" class="hover-readout" hidden></p>
      <p id="overlay-note" class="overlay-note" hidden></p>
      <aside id="legend" aria-label="Graph legend">
        <button type="button" id="legend-toggle" aria-expanded="true">Legend</button>
        <div id="legend-body">
          <div id="legend-nodes"></div>
          <div id="legend-edges"></div>
        </div>
      </aside>
    </div>
    <aside id="detail"></aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
