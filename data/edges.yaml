# =============================================================================
# edges.yaml — single source of truth for typed relationships
# =============================================================================
#
# Schema
#   from, to    node ids (see nodes.yaml)
#   type        gold | cyan | magenta | green | red | orange
#   directed    true  = constitutive / causal / ascent-descent arrow
#               false = symmetric map (isomorphism, contrast, hybrid)
#   strength    0.0–1.0  (keep high: this file is the *strongest* links only)
#   versions    which of V1–V11 the edge is drawn from
#   note        one-sentence rationale
#
# Type language (matches the diagrams)
#   gold     direct rooting — higher → lower on the spine, or a later
#            system rooted in a Platonic node
#   cyan     isomorphism — same slot, not the same thing
#   magenta  contrast / inversion — same slot, opposite valuation
#   green    return / integration / negative feedback
#   red      fall / positive feedback / shattering
#   orange   hybrid / lateral — cross-domain mix that does not go via the spine
#
# Direction convention
#   gold, red : source acts on, constitutes, or destabilises target
#   green     : source returns toward / restores target
#   cyan, magenta, orange : undirected (from/to is only a stable writing order)
# =============================================================================

