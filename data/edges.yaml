# =============================================================================
# edges.yaml — single source of truth for typed relationships
# =============================================================================
#
# Schema
#   from, to    node ids (see nodes.yaml)
#   type        gold | cyan | magenta | green | red | orange
#   directed    true  = flow (constitutive / fall / return). Draw one arrow.
#               false = symmetric map (isomorphism, contrast, hybrid).
#               Draw marks both ways. Not a third schema.
#
# Trajectories (A via … to B, feedback loops) are query overlays, not extra
# YAML. A new finding between existing nodes is one more binary edge — or a
# new principle if three-or-more actors occupy a distinct slot. No hyperedges.
#   strength    0.0–1.0 editorial confidence.
#               Community detection uses it as edge weight.
#               It is not chord width and not betweenness weight.
#   versions    optional diagram tags (V1–V11). Illustrative, not required.
#   note        one-sentence rationale
#
# Type language
#   gold     constitutive or genealogical dependence (source → dependent).
#            Not reserved for “descends from Plato.”
#   cyan     isomorphism — same slot, not the same thing
#   magenta  contrast / inversion — same slot, opposite valuation
#   green    return / integration / negative feedback
#   red      fall / positive feedback / shattering
#   orange   hybrid / lateral — peer mixing; the V5 growth pattern
#
# Prefer laterals and collisions. A new edge does not need a Platonic end.
# =============================================================================

