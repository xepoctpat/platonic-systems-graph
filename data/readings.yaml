# =============================================================================
# readings.yaml — finished findings for the Reading tab
# =============================================================================
#
# Tab content, not a research queue. One reading is one origin: a Mermaid
# chart, the claim, the attribute table, what is confirmed, and what is open.
# The paragraph stays off the arrow. Blank cells are not edges.
# =============================================================================

readings:

  - id: order-kept
    title: "Ma'at · ṛta · Asha"
    claim: >
      Egypt, Vedic India, and Iran share an order that must be kept.
      No school descended from another.
    status: confirmed
    mermaid: |
      flowchart LR
        maat["Ma'at"] ---|"cyan · order kept"| rta["Ṛta"]
        rta ---|"cyan · cognate"| asha["Asha"]
        maat ---|"cyan · order kept"| asha
    confirmed: >
      The three cyan edges are already in the graph (rta–maat, asha–rta, asha–maat).
      The sharing is open.
    open: >
      Restoration stays inside each tradition (Ma'at re-established, Asha chosen
      against Druj, ṛta guarded by Varuṇa). Those are not edges among the three names.
    attributes:
      columns:
        - label: Attribute
        - label: "Ma'at"
          id: maat
        - label: "Ṛta"
          id: rta
        - label: Asha
          id: asha
      rows:
        - - order that must be kept
          - "Order, truth, and right measure, continually re-established. Already sourced in the graph note on maat."
          - "Order that is kept, not a person. Already sourced in the graph note on rta, and in the rta–maat edge note."
          - "Truth and rightness that must be chosen and kept. Already sourced in the graph note on asha, and in the asha–maat edge note."

  - id: solar
    title: "Sūrya · Helios · Re · Mitra"
    claim: >
      The chariot is shared by Sūrya and Helios. Re crosses by barque, not car.
      Mitra is covenant, not the sun.
    status: confirmed
    mermaid: |
      flowchart LR
        surya["Sūrya"] ---|"cyan · chariot"| helios["Helios"]
        surya ---|"orange · barque"| re["Re"]
        helios ---|"orange · barque"| re
        mitra["Mitra"] ---|"orange · not the sun"| surya
        mitra ---|"cyan · paired keepers"| varuna["Varuṇa"]
    confirmed: >
      Five laterals: Sūrya–Helios cyan (chariot), Sūrya–Re and Helios–Re orange
      (barque), Mitra–Sūrya orange (not the sun), Mitra–Varuṇa cyan (paired keepers).
    open: >
      Jesus is not encoded. Avestan Miθra shares the covenant in its own
      reading (Ṛgveda 3.59.1 and Yt. 10.2). Blank cells are not edges.
    attributes:
      columns:
        - label: Attribute
        - label: "Sūrya"
          id: surya
        - label: Helios
          id: helios
        - label: Re
          id: re
        - label: Mitra
          id: mitra
      rows:
        - - Chariot or daily crossing
          - "RV 1.50.8–9, seven steeds"
          - "Homeric Hymn 31, golden-yoked car"
          - "Night barque, not a chariot (Amduat)"
          - ""
        - - Eye or light that sees
          - "Far-seeing, RV 1.50.8"
          - "Sees and hears all, Odyssey 12.320"
          - ""
          - "Eyes that do not close, RV 3.59.1"
        - - Witness to oaths
          - ""
          - ""
          - ""
          - "Sets peoples to their agreements, RV 3.59.1"
        - - Sovereignty
          - ""
          - ""
          - ""
          - "Born a king, RV 3.59.4, not the sun's sovereignty"
        - - Companion who is not the sun
          - ""
          - ""
          - ""
          - "Paired with Varuṇa. Avestan Miθra is its own reading"

  - id: mitra-jesus
    title: "Mitra · Jesus"
    claim: >
      Vedic Mitra and Jesus do not share a solar function or Mitra's covenant
      in the passages opened.
    status: unclassified
    mermaid: |
      flowchart LR
        mitra["Mitra"]
        jesus["Jesus"]
    confirmed: "No shared attribute in the passages opened. No node. No edge."
    open: >
      Does any named passage give Jesus the unclosing watch of Ṛgveda 3.59.1,
      or his setting of peoples to their agreements?
    attributes:
      columns:
        - label: Attribute
        - label: Mitra
          id: mitra
        - label: "Jesus / Hebrew"
          id: jesus
      rows:
        - - Chariot or daily crossing
          - ""
          - ""
        - - "Eye, or light that sees"
          - "Eyes that do not close, Ṛgveda 3.59.1"
          - ""
        - - Witness to oaths or covenants
          - "Sets peoples to their agreements, Ṛgveda 3.59.1"
          - ""
        - - "Sovereignty (sun as king)"
          - "Born a king, Ṛgveda 3.59.4. That kingship is not the sun's"
          - ""
        - - Companion who is not the sun
          - "Paired with Varuṇa"
          - ""

  - id: avestan-mithra
    title: "Mitra · Miθra"
    claim: >
      Vedic Mitra and Avestan Miθra share the covenant and a chariot.
      The companion is a partial swap: the second member did not transfer.
      Varuṇa (Ṛgveda 5.72.1 and 5.72.3) does not arrive as Ahura (Yt. 10.145).
    status: confirmed
    mermaid: |
      flowchart LR
        mitra["Mitra"] ---|"cyan · covenant"| avestan-mithra["Miθra"]
        mitra ---|"orange · unsleeping eye"| avestan-mithra
        mitra ---|"orange · kingship"| avestan-mithra
        mitra ---|"cyan · chariot"| avestan-mithra
        mitra ---|"orange · companion"| avestan-mithra
    confirmed: >
      Five laterals, marked both ways. Covenant (Ṛgveda 3.59.1; Yt. 10.2).
      Eye: partial swap (Ṛgveda 3.59.1; Yt. 10.7; Yt. 10.13). Kingship:
      partial swap (Ṛgveda 3.59.4; Yt. 10.16; Yt. 10.145). Chariot
      (Ṛgveda 5.63.1; Ṛgveda 1.122.15; Yt. 10.124–125). Companion: the
      second member did not transfer. Varuṇa (Ṛgveda 5.72.1 and 5.72.3);
      Ahura (Yt. 10.145, the pair). The sun is a separate sacrifice.
    open: >
      The before-the-sun crossing (Yt. 10.13) is Avestan only. It does not
      fill the Vedic cell. Mills’s Gathas do not name Mithra.
    attributes:
      columns:
        - label: Attribute
        - label: Mitra
          id: mitra
        - label: "Miθra"
          id: avestan-mithra
      rows:
        - - Chariot or daily crossing
          - "Mounts the chariot in the highest heaven, with Varuṇa (Ṛgveda 5.63.1). The same chariot (Ṛgveda 1.122.15)"
          - "Gold chariot, four white stallions (Yt. 10.124–125). Before the sun over the Hara (Yt. 10.13). That crossing does not fill the Vedic cell"
        - - "Eye, or light that sees"
          - "Beholds the peoples with eyes that do not close, Ṛgveda 3.59.1"
          - "Ten thousand eyes, and sleepless, as separate epithets (Yt. 10.7). A beneficent eye over the Aryan abode (Yt. 10.13)"
        - - Witness to oaths or covenants
          - "Sets peoples to their agreements, Ṛgveda 3.59.1"
          - "Break not the contract (Yt. 10.2)"
        - - "Sovereignty (the sun as king, not only as lamp)"
          - "Born as king, of good dominion, as disposer, Ṛgveda 3.59.4. The verse names no sun"
          - "Brings sovereignty while crossing every karshwar (Yt. 10.16). Lord of all countries (Yt. 10.145). The sun is a separate sacrifice"
        - - Companion who is not the sun
          - "Offered to with Varuṇa; both sit for soma (Ṛgveda 5.72.1 and 5.72.3). The sun is not named"
          - "Sacrificed with Ahura as the two gods (Yt. 10.145, the pair). The sun is a separate sacrifice"
