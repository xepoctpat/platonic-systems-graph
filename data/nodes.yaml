# =============================================================================
# nodes.yaml — single source of truth for graph vertices
# =============================================================================
#
# Schema
#   id           kebab-case key (stable; referenced by edges.yaml)
#   label        display name
#   kind         system | principle
#                  system    = a tradition or field treated as a peer
#                  principle = a distinct operator, god, event, or slot
#   cluster      peer group (not a rank). Examples: platonic, gnostic,
#                hermetic, neoplatonic, kabbalistic, scientific, …
#   role         optional functional hint (governor, noise, …) — not a spine index
#   description  short research note
#   refs         optional textual citations
#
# There is no privileged stage field and no required attachment to Plato.
# Clusters are labels for filtering. An organic spine, if any, is an output
# of analysis (betweenness, communities, return/fall cycles), not a schema rule.
#
# Optional later: axes: {name: score} for a semantic 2D placement.
# Do not invent axis scores until a named cut exists.
# =============================================================================

nodes:

  # ---- systems (peer traditions / fields) ----
  - id: alchemy
    label: "Alchemy"
    kind: system
    cluster: alchemical
    description: >
      The opus as a material return path. V5 places it laterally toward Theosophy
      rather than only as a Platonic descendant.
    refs: ["Emerald Tablet"]

  - id: biblical-religion
    label: "Biblical religion"
    kind: system
    cluster: biblical
    description: >
      Genesis speech-creation and tohu as a peer, not a Timaean footnote.
    refs: ["Genesis 1"]

  - id: buddhism
    label: "Buddhism"
    kind: system
    cluster: buddhist
    description: >
      Peer system that often refuses the craftsman and the Good-as-source. Śūnyatā
      is the summit refusal. Ālayavijñāna and vijñaptimātra are Yogācāra occupants,
      not that summit. The system is not exhausted by any one of them.
    refs: ["Mūlamadhyamakakārikā"]

  - id: christianity
    label: "Christianity"
    kind: system
    cluster: christian
    description: >
      Johannine / patristic stream as a peer: Logos, incarnation, and a personal
      creator. Cyan-cousin of Gnosticism; not a Platonic stage.
    refs: ["John 1", "Nicene reception"]

  - id: egyptian-religion
    label: "Egyptian religion"
    kind: system
    cluster: egyptian
    description: >
      Several temple cosmogonies in one peer system, not one ladder. Memphis
      (Ptah by heart and tongue), Heliopolis (Nun, Atum, Re), Thebes (Amun
      hidden), plus the Osiris cycle of cut and gathering. Ma'at is the order
      that must be kept. The rest of the pantheon is not encoded.
    refs: ["Memphite Theology (Shabaka Stone)", "Pyramid Texts", "Heliopolitan Ennead"]

  - id: gnosticism
    label: "Gnosticism"
    kind: system
    cluster: gnostic
    description: >
      Parent handle for colliding peer schools that occupy craftsman / matter /
      time / ascent / summit with inverted valuation. Not itself a third school.
      Sethian and Valentinian are the interiors.
    refs: ["Apocryphon of John", "Irenaeus, Adversus Haereses I"]

  - id: sethianism
    label: "Sethianism"
    kind: system
    cluster: gnostic
    description: >
      Classic Gnostic school of the Apocryphon of John. Invisible Spirit, Barbelo,
      Sophia’s unauthorized birth, Yaldabaoth the lion-serpent. Seed of Seth is
      the elect, not encoded as a list.
    refs: ["Apocryphon of John (NHC II,1 / III,1 / IV,1 / BG 8502)", "Hypostasis of the Archons"]

  - id: valentinianism
    label: "Valentinianism"
    kind: system
    cluster: gnostic
    description: >
      Ptolemy / Valentinus stream. Sophia is restrained by Horos; her enthymesis
      (Achamoth) is fenced out; a psychic Demiurge makes the world as an instrument.
      Not the Sethian archontic prison-maker.
    refs: ["Irenaeus, Adversus Haereses I.1–8", "Gospel of Truth"]

  - id: mystery-religions
    label: "Mystery religions"
    kind: system
    cluster: hellenic-mystery
    description: >
      Eleusinian-type ascent as a peer rite-path, not a Platonic stage.
    refs: ["Homeric Hymn to Demeter"]

  - id: hermeticism
    label: "Hermeticism"
    kind: system
    cluster: hermetic
    description: >
      Corpus Hermeticum / Asclepius as a hybrid stream: sometimes a benevolent
      craftsman-intellect, sometimes an escape from the spheres.
    refs: ["CH I (Poimandres)", "Asclepius"]

  - id: hinduism
    label: "Hinduism"
    kind: system
    cluster: hindu
    description: >
      Later umbrella for Upaniṣadic Brahman, Sāṃkhya, Purāṇic operators, and
      ṣaḍ-darśana occupants (adhyāsa, apauruṣeya, paramāṇu, kaivalya, Nyāya
      Īśvara). The Ṛgvedic corpus is its own system node (`vedic`), not
      collapsed here. Not avatāra lists, every Devī form, Vedānta subschools,
      or pramāṇa/padārtha lists.
    refs:
      - "Upaniṣads"
      - "Sāṃkhya-kārikā"
      - "Maitrī Upaniṣad 5.2"
      - "Devī Māhātmya (Mārkaṇḍeya Purāṇa 81–93)"
      - "Coburn, Encountering the Goddess"

  - id: vedic
    label: "Vedic religion"
    kind: system
    cluster: vedic
    description: >
      Ṛgvedic hymn corpus as a peer system. Storm-king, fire-priest, soma,
      ṛta, and the Puruṣa hymn. Not later Hinduism and not every named deva.
    refs: ["Ṛgveda", "Macdonell, Vedic Mythology"]

  - id: jungian-psychology
    label: "Jungian psychology"
    kind: system
    cluster: jungian
    description: >
      Archetypes and individuation as a peer. V5 hybrid toward Gnosticism and
      Theosophy — a lateral, not a Platonic stage.
    refs: ["Jung, Aion; Psychology and Alchemy"]

  - id: merkavah
    label: "Merkavah"
    kind: system
    cluster: jewish-mystical
    description: >
      Hekhalot / chariot mysticism. Descent through palaces to the throne of
      Glory. Peer precursor to Kabbalah, not a stage of Ein Sof.
    refs:
      - "Ezekiel 1"
      - "Hekhalot Rabbati"
      - "3 Enoch (Sefer Hekhalot)"
      - "Mishnah Hagigah 2:1"

  - id: kabbalah
    label: "Kabbalah"
    kind: system
    cluster: kabbalistic
    description: >
      Jewish theosophy as a peer emanation system (Ein Sof, sefirot, shevirah,
      tikkun). Lateral to physics in V5 as a structured cascade.
    refs: ["Zohar", "Lurianic writings"]

  - id: mesopotamian
    label: "Mesopotamian religion"
    kind: system
    cluster: mesopotamian
    description: >
      Sumerian world-order (Enki, me, An–Ki split) and Babylonian Enūma Eliš
      (Marduk, Tiamat) as a peer system. First readable cosmogony on the queue.
      Not a Platonic stage and not exhausted by the flood story.
    refs: ["ETCSL 1.1.3 Enki and the World Order", "Lambert 2013, Babylonian Creation Myths"]

  - id: neoplatonism
    label: "Neoplatonism"
    kind: system
    cluster: neoplatonic
    description: >
      Plotinus through Iamblichus / Proclus: procession and return, closer to Plato
      on the craftsman than Gnosticism is, but the One is intensified beyond the
      Republic’s Good.
    refs: ["Enneads", "Iamblichus, De Mysteriis"]

  - id: norse-myth
    label: "Norse myth"
    kind: system
    cluster: norse
    description: >
      North-Atlantic cosmogony from Völuspá, with Gylfaginning as the prose
      companion for the slaying of Ymir. Gap, first being, world-tree, fate,
      end, and a green earth after. Not every named dwarf or Æsir.
    refs:
      - "Völuspá (Poetic Edda, Codex Regius)"
      - "Gylfaginning 4–8 (Prose Edda)"
      - "Grímnismál 40–41 (Ymir’s body)"

  - id: popol-vuh
    label: "Popol Vuh"
    kind: system
    cluster: mesoamerican
    description: >
      Kʼicheʼ Book of the Council. Sky-sea stillness, makers who speak the
      earth, failed people, maize people, and the Hero Twins against Xibalba.
      One named corpus, not Mexica suns and not every Maya city.
    refs:
      - "Popol Vuh (Tedlock 1996)"
      - "Christenson, Popol Vuh: The Sacred Book of the Maya"
      - "Ximénez manuscript (Newberry)"

  - id: ifa
    label: "Ifá"
    kind: system
    cluster: yoruba
    description: >
      Yoruba Ifá literary corpus (256 Odù). Olodumare delegates; Obatala and
      Oduduwa make land and bodies; Orunmila witnesses destiny. Named corpus,
      not every orisha and not a West Africa sticker.
    refs:
      - "Odù Ifá"
      - "Abimbola, Ifá: An Exposition of Ifá Literary Corpus (1976)"
      - "Idowu, Olódùmarè: God in Yoruba Belief (1962)"

  - id: orphism
    label: "Orphism"
    kind: system
    cluster: orphic
    description: >
      Hellenic dismemberment-and-return as a peer fall/return system.
    refs: ["Orphic fragments"]

  - id: platonism
    label: "Platonism"
    kind: system
    cluster: platonic
    description: >
      The Platonic tradition as a peer system, not a privileged axis. Entry on-ramp
      for craftsman, soul, ordered time, receptacle, and eros. Does not
      automatically root every other node.
    refs: ["Timaeus", "Statesman", "Symposium", "Republic VI–VII"]

  - id: pythagoreanism
    label: "Pythagoreanism"
    kind: system
    cluster: pythagorean
    description: >
      Numbered cosmos as a peer, not a Plato stage. Philolaus: limiters and
      unlimiteds fitted by harmonia. Aristotle’s “all is number” is a report,
      not the first fragment.
    refs:
      - "Philolaus B1, B6 (Huffman)"
      - "Aristotle, Metaphysics A5"

  - id: aristotelianism
    label: "Aristotelianism"
    kind: system
    cluster: scientific
    description: >
      Peripatetic cosmos with an unmoved mover as final cause. Peer to Plato,
      not a later stage of the Good.
    refs: ["Metaphysics Λ", "Physics VIII"]

  - id: stoicism
    label: "Stoicism"
    kind: system
    cluster: scientific
    description: >
      Immanent logos / pneuma as the world’s active principle. Peer to both
      Plato’s World Soul and later Hermetic nous.
    refs: ["SVF fragments", "Cleanthes, Hymn to Zeus"]

  - id: complexity-science
    label: "Complexity science"
    kind: system
    cluster: scientific
    description: >
      Emergence, nonlinearity, self-organization as a peer system. V5 cyan to
      Hermeticism.
    refs: ["Prigogine", "Kauffman"]

  - id: information-theory
    label: "Information theory"
    kind: system
    cluster: scientific
    description: >
      Entropy, coding, constraint as a peer system.
    refs: ["Shannon", "Bateson"]

  - id: physics
    label: "Physics"
    kind: system
    cluster: scientific
    description: >
      Laws, fields, symmetry breaking as a peer system. V5 cyan to Kabbalah as
      structured cascade, not as Platonic descent.
    refs: ["modern physics (placeholder pending survey)"]

  - id: process-thought
    label: "Process thought"
    kind: system
    cluster: scientific
    description: >
      Whiteheadian process as a peer system. The existing process principle
      now has a home. Not every commentator.
    refs: ["Process and Reality"]

  - id: systems-theory
    label: "Systems theory"
    kind: system
    cluster: scientific
    description: >
      Holons, boundaries, feedback as a peer system. V5 cyan to Neoplatonism.
    refs: ["Bertalanffy", "Wiener"]

  - id: islamic-philosophy
    label: "Islamic philosophy"
    kind: system
    cluster: islamic
    description: >
      Falsafa / kalām reception of Aristotle and the Neoplatonic corpus as a peer.
      Avicenna’s Necessary Existent is the first occupant. Ishrāq later.
    refs:
      - "Avicenna, Shifa Ilahiyyat"
      - "Avicenna, Najat"

  - id: sufism
    label: "Sufism"
    kind: system
    cluster: sufi
    description: >
      Islamic mystical stream as a peer. Fanāʾ / baqāʾ is the first interior
      occupant (Junayd). Not every ṭarīqa or later waḥdat al-wujūd dump.
    refs: ["Junayd, Kitab al-fana (attr.)", "Iranica, Baqa wa Fana"]

  - id: theosophy
    label: "Theosophy"
    kind: system
    cluster: theosophical
    description: >
      Blavatsky / later theosophy as a modern hybrid hub on V5: alchemy, Jung,
      Hinduism, Sufism. Comparative myth is a method, not a peer system.
    refs: ["Blavatsky, The Secret Doctrine (survey pending)"]

  - id: zoroastrianism
    label: "Zoroastrianism"
    kind: system
    cluster: zoroastrian
    description: >
      Gathic choice of asha against druj; later cosmic fight of Ahura Mazda
      and Angra Mainyu; Zurvanite infinite time as a later overlay. Twin of
      the Vedic stream, not a Platonic footnote.
    refs: ["Gathas", "Younger Avesta", "Pahlavi Zurvan texts"]

  - id: manichaeism
    label: "Manichaeism"
    kind: system
    cluster: manichaean
    description: >
      Mani’s church of two uncreated principles and three times. Iranian dualism
      recast as a universal gnosis with a missionary canon. Not a Gnostic school
      and not a Zoroastrian heresy.
    refs:
      - "Kephalaia (two principles / three times)"
      - "Theodore bar Konai, Scholion (cosmogony)"
      - "Gnoli, Manichaeism: An Overview (Encyclopedia of Religion)"

  - id: mandaeism
    label: "Mandaeism"
    kind: system
    cluster: mandaean
    description: >
      Living baptismal religion of the Mandaeans (Naṣoraeans). Dual Worlds of
      Light and Darkness; Four Lives; repeated immersion in running water.
      Gnostic-adjacent, not a Sethian or Valentinian school, and not Mani's
      church. John the Baptist is a priest in the story, not the founder.
    refs:
      - "Ginza (Right / Left)"
      - "Qolasta (Drower, Canonical Prayerbook)"
      - "Rudolph, Iranica MANDAEANS ii"

  - id: early-china
    label: "Early China"
    kind: system
    cluster: chinese
    description: >
      Shang–Zhou Heaven and Mandate, the Yijing’s change, and the Daodejing’s
      Dao as one peer field. Not later imperial cult, not every sage, not Pangu.
    refs:
      - "Shangshu / Shijing (tianming)"
      - "Yijing, Xici I"
      - "Daodejing 1, 25, 42"

  - id: canaanite
    label: "Canaanite religion"
    kind: system
    cluster: canaanite
    description: >
      Late Bronze Ugaritic corpus as a peer, not a biblical footnote. El sits
      above; Baal fights Yam and Mot; Kothar builds weapons and palace. Small
      readable cycle (KTU 1.1–1.6). Keret and Aqhat stay out.
    refs: ["Baal Cycle KTU 1.1–1.6", "Smith, The Ugaritic Baal Cycle"]

  - id: paleolithic-image
    label: "Palaeolithic image"
    kind: system
    cluster: preliterate
    description: >
      Upper Palaeolithic practice of composed images (Chauvet, Lascaux, Swabian
      ivory). A long habit of putting animals and hybrids in special places.
      Not a readable pantheon. Includes earlier African geometric marks as the
      floor of mark-making.
    refs: ["Geneste, From Chauvet to Lascaux", "Henshilwood et al. on Blombos ochre"]

  - id: ppn-ritual
    label: "PPN monumental ritual"
    kind: system
    cluster: preliterate
    description: >
      Pre-Pottery Neolithic stone enclosures in south-east Anatolia (Göbekli Tepe,
      Karahan Tepe, Taş Tepeler), c. 9600–7000 BCE. Oldest large ritual or communal
      stone architecture we can point at. No texts. Temple versus house is open.
    refs: ["Schmidt on Göbekli Tepe", "Banning 2011, Current Anthropology"]

  - id: lepenski-vir
    label: "Lepenski Vir"
    kind: system
    cluster: preliterate
    description: >
      Iron Gates Danube culture (eastern Serbia / Romanian bank), Mesolithic into
      Early Neolithic. Trapezoid houses facing the river, hearth at centre,
      sandstone fish-human sculptures. Older and different from Vinča. Later
      layer is Starčevo pottery, not Vinča interiors.
    refs: ["Bonsall et al. on Iron Gates chronology", "National Museum of Serbia, Lepenski Vir collection"]

  - id: vinca
    label: "Vinča culture"
    kind: system
    cluster: preliterate
    description: >
      Central Balkan Late Neolithic–Chalcolithic, c. 5400–4500 BCE. Type site
      Vinča-Belo Brdo on the Danube below Belgrade. Farming tells, burnished
      pottery, clay figurines, incised signs, early copper. This is the pottery
      and figurine package, not Lepenski Vir’s stone river-images.
    refs: ["Vinča-Belo Brdo radiocarbon syntheses (2009, 2016)", "Vasić excavations"]

  # ---- principles (operators, events, slots) ----
  - id: alchemical-opus
    label: "Alchemical Opus"
    kind: principle
    cluster: alchemical
    role: negative-feedback
    description: >
      Solve et coagula as a materialised return path: nigredo (fall/dissolve)
      through albedo to rubedo (integration). Hybrid of Timaean elemental work and
      erotic / theurgic ascent, enacted on bodies.
    refs: ["Emerald Tablet", "later Western opus literature"]

  - id: genesis-creator
    label: "Genesis Creator"
    kind: principle
    cluster: biblical
    role: controller
    description: >
      God who speaks heavens and earth into being, separates, and sees that it is
      good. Craftsman-adjacent, but classically read as creating without a coeval
      receptacle (the V4 / V11 tension with Timaeus).
    refs: ["Genesis 1"]

  - id: hokhmah
    label: "Hokhmah"
    kind: principle
    cluster: biblical
    role: model
    description: >
      Personified Wisdom of Proverbs 8: present at creation, a master-worker
      beside the Lord. Not a second Genesis creator and not Sophia’s fall.
    refs: ["Proverbs 8", "Job 28"]

  - id: tohu-vavohu
    label: "Tohu va-Bohu"
    kind: principle
    cluster: biblical
    role: noise
    description: >
      Formless-and-void of Genesis 1:2, with the deep (tehom). Functional analogue
      of chōra / necessity — the unordered given that speech then articulates — and,
      in later receptions, a door toward kenoma readings.
    refs: ["Genesis 1:2"]

  - id: sunyata
    label: "Śūnyatā"
    kind: principle
    cluster: buddhist
    role: attractor
    description: >
      Emptiness of inherent existence. Nāgārjuna identifies it with dependent
      origination (MMK 24.18), so pratītyasamutpāda is not a second node.
      Occupies the summit slot by refusing the slot: no Good that is a source
      of Forms, no craftsman, no receptacle-as-third-kind.
    refs: ["Mūlamadhyamakakārikā 24.18", "Prajñāpāramitā"]

  - id: alaya-vijnana
    label: "Ālayavijñāna"
    kind: principle
    cluster: buddhist
    description: >
      Storehouse consciousness. It carries every seed and flows like a torrent;
      it is not a self, and it is given up at arhatship. Continuity of karma,
      not a witness and not a material nurse.
    refs: ["Vasubandhu, Triṃśikā 2–4"]

  - id: vijnaptimatra
    label: "Vijñaptimātra"
    kind: principle
    cluster: buddhist
    description: >
      Representation-only. What is discriminated does not exist as discriminated,
      so all this is vijñaptimātra. Not an overlay on Brahman, and not an
      emptiness that refuses a mental ground.
    refs: ["Vasubandhu, Triṃśikā 17"]

  - id: christian-logos
    label: "Johannine Logos"
    kind: principle
    cluster: christian
    role: controller
    description: >
      Word who was with God and was God, through whom all things were made. Fuses
      paradigm, craftsman, and (in later doctrine) the Good’s self- expression.
      Principal V4 / V5 hybrid on the religious side.
    refs: ["John 1:1–18"]

  - id: incarnation
    label: "Incarnation"
    kind: principle
    cluster: christian
    role: hybrid
    description: >
      The Logos becoming flesh. Opposite vector to escape-gnosis: the divine term
      *enters* becoming rather than extracting sparks from it. Orange / green
      depending on whether one stresses hybridity or return.
    refs: ["John 1:14", "Nicene reception"]

  - id: maat
    label: "Ma'at"
    kind: principle
    cluster: egyptian
    role: clock
    description: >
      Egyptian order, truth, and right measure that gods and kings must continually
      re-establish. Religious name for ordered time plus the Good-as-norm — order as
      something *maintained*, not once-for-all.
    refs: ["Egyptian wisdom literature; temple theology"]

  - id: ptah
    label: "Ptah"
    kind: principle
    cluster: egyptian
    role: controller
    description: >
      Memphite craftsman-god who brings the world forth by heart and tongue.
      Pre-Platonic and extra-Hellenic occupant of the Demiurge slot: a divine
      artisan whose organ is intelligent speech.
    refs: ["Memphite Theology (Shabaka Stone)"]

  - id: escape-gnosis
    label: "Escape Gnosis"
    kind: principle
    cluster: gnostic
    role: exit
    description: >
      Soteriology whose end is *exit* from the cosmos — awakening, passwords through
      the spheres, return of the spark — rather than integration of becoming into
      the Good. The V10 pole against cosmic Eros.
    refs: ["Gospel of Thomas 42 (motif)", "Pistis Sophia (ascent)"]

  - id: fallen-time
    label: "Fallen Time"
    kind: principle
    cluster: gnostic
    role: clock
    description: >
      Time as exile, irreversible loss, or apocalyptic waiting — the V9 pole against
      Timaean ordered time. Covers Gnostic sojourn in the spheres, later
      fall-narratives, and the Statesman world running down once the steersman has
      let go.
    refs: ["Gnostic ascent tractates", "Statesman 273c–e (run-down)"]

  - id: gnostic-demiurge
    label: "Gnostic Demiurge"
    kind: principle
    cluster: gnostic
    role: controller
    description: >
      Sethian Yaldabaoth / Saklas / Samael. Lion-serpent archon who steals power
      from Sophia, fabricates the spheres, and says “I am God and there is no
      other.” The V7 prison-maker. Not the Valentinian psychic craftsman.
    refs: ["Apocryphon of John", "Hypostasis of the Archons"]

  - id: barbelo
    label: "Barbelo"
    kind: principle
    cluster: gnostic
    role: model
    description: >
      Sethian First Thought / image of the Invisible Spirit. Forethought from
      which Autogenes and the aeons unfold. Not Bythos and not a Valentinian syzygy.
    refs: ["Apocryphon of John (Barbelo as first power)"]

  - id: horos
    label: "Horos"
    kind: principle
    cluster: gnostic
    role: governor
    description: >
      Valentinian Limit (also Stauros, Lytrotes). Restrains Sophia, fences her
      enthymesis out of the Pleroma, and restores her to her pair. A boundary
      operator Sethianism does not isolate.
    refs: ["Irenaeus, Adversus Haereses I.2"]

  - id: achamoth
    label: "Achamoth"
    kind: principle
    cluster: gnostic
    role: positive-feedback
    description: >
      Lower Wisdom: Sophia’s expelled enthymesis, shapeless, outside the Pleroma.
      Her passions become matter and soul; she is mother of the Valentinian
      Demiurge. Not the higher Sophia who remains inside.
    refs: ["Irenaeus, Adversus Haereses I.2.4, I.4–5"]

  - id: valentinian-demiurge
    label: "Valentinian Demiurge"
    kind: principle
    cluster: gnostic
    role: controller
    description: >
      Psychic craftsman, son of Achamoth. Makes everything outside the Pleroma
      and thinks he is the only god, but is an instrument of restoration. Animal
      men go with him; pneumatics pass beyond. Not Yaldabaoth.
    refs: ["Irenaeus, Adversus Haereses I.5, I.7"]

  - id: gnostic-unknown-father
    label: "Unknown Father"
    kind: principle
    cluster: gnostic
    role: attractor
    description: >
      Shared summit name: Sethian Invisible Spirit / Valentinian Bythos–Propator.
      Defined by unknowability to the world-craftsman. Not split unless the two
      summits start occupying different slots.
    refs: ["Apocryphon of John", "Irenaeus, Adversus Haereses I.1–2"]

  - id: kenoma
    label: "Kenoma"
    kind: principle
    cluster: gnostic
    role: prison
    description: >
      Emptiness / deficiency: matter and the cosmic spheres as a prison for sparks
      of pleromatic light. The V8 pole against chōra-as-nurse.
    refs: ["Valentinian sources", "Apocryphon of John"]

  - id: pleroma
    label: "Pleroma"
    kind: principle
    cluster: gnostic
    role: model
    description: >
      Fullness of aeons generated from the Unknown Father. Structural analogue of
      the intelligible paradigm — a complete divine inventory — but sealed off from
      the cosmos the archons will make.
    refs: ["Apocryphon of John", "Gospel of Truth"]

  - id: sophia-fall
    label: "Sophia’s Fall"
    kind: principle
    cluster: gnostic
    role: positive-feedback
    description: >
      Shared fall: Sethian Sophia conceives without a consort; Valentinian Sophia
      stretches toward the Father and is cut. Native account of how fullness
      becomes lack. Downstream craftsmen now differ by school.
    refs: ["Apocryphon of John", "Irenaeus, Adversus Haereses I.2"]

  - id: mystery-ascent
    label: "Mystery Ascent"
    kind: principle
    cluster: hellenic-mystery
    role: negative-feedback
    description: >
      Eleusinian and related mystery patterns: descent, vision, and a changed
      standing toward death. Religious green path parallel to Symposium eros,
      without a full Timaean cosmology.
    refs: ["Homeric Hymn to Demeter", "later mystery testimonia"]

  - id: hermetic-nous
    label: "Hermetic Nous"
    kind: principle
    cluster: hermetic
    description: >
      Poimandres / Corpus Hermeticum: nous as both revealer and inner god, with a
      craftsman-intellect and a cosmos that can be either temple or trap depending
      on the tractate. Hybrid of Timaean craftsman and ascent-gnosis.
    refs: ["CH I (Poimandres)", "CH XI"]

  - id: brahman
    label: "Brahman"
    kind: principle
    cluster: hindu
    role: attractor
    description: >
      Ultimate in Upaniṣadic / Vedāntic thought, especially nirguṇa.
      Highest-principle analogue (V11): closer to the One / Ein Sof than to a
      craftsman, and typically without a Demiurge who looks to Forms.
    refs: ["Bṛhadāraṇyaka, Chāndogya", "later Vedānta"]

  - id: purusha-prakriti
    label: "Purusha–Prakriti"
    kind: principle
    cluster: hindu
    description: >
      Sāṃkhya pair: witnessing consciousness and productive nature. Lateral
      isomorphism of paradigm / receptacle *without* a craftsman between them —
      nature evolves; purusha does not make.
    refs: ["Sāṃkhya-kārikā"]

  - id: ein-sof
    label: "Ein Sof"
    kind: principle
    cluster: kabbalistic
    role: attractor
    description: >
      The Infinite of Kabbalah, beyond sefirotic predication. Highest-principle
      analogue of the Good / One (V11), typically more apophatic than Plato’s
      Good-as-source-of-Form.
    refs: ["Zohar", "Lurianic writings"]

  - id: sefirot
    label: "Sefirot"
    kind: principle
    cluster: kabbalistic
    role: model
    description: >
      Ten emanated measures of divine life. Hierarchical, inter-converting, and
      diagrammable — the most explicit later isomorphism of a procession from a
      hidden summit into a structured pleroma.
    refs: ["Sefer Yetzirah", "Zohar"]

  - id: shevirah
    label: "Shevirah"
    kind: principle
    cluster: kabbalistic
    role: positive-feedback
    description: >
      Lurianic breaking of the vessels: the lower sefirot cannot hold the influx,
      shards and husks result. Canonical red event — shattering as the condition of
      a world that then needs repair.
    refs: ["Luria / Vital, Etz Hayim"]

  - id: tikkun
    label: "Tikkun"
    kind: principle
    cluster: kabbalistic
    role: negative-feedback
    description: >
      Restoration and repair of the broken vessels, including human ritual and
      ethical work. Canonical green return on the Kabbalistic side; lateral kin of
      Eros, theurgy, and the alchemical opus (V5).
    refs: ["Luria / Vital, Etz Hayim"]

  - id: chaldean-oracles
    label: "Chaldean Oracles"
    kind: principle
    cluster: neoplatonic
    description: >
      Middle-Platonic hexameter revelation: Father, Dynamis, Intellect, and Hecate
      as world-womb. Principal native source for later theurgy and a
      craftsman-intellect still loyal to a higher Father.
    refs: ["Chaldean Oracles (ed. des Places)"]

  - id: nous-neoplatonic
    label: "Neoplatonic Nous"
    kind: principle
    cluster: neoplatonic
    role: model
    description: >
      Second hypostasis: intellect identical with the intelligible. Fuses the
      Timaean paradigm and the Demiurge into a single self-thinking cosmos of Forms.
    refs: ["Enneads V.1", "Enneads V.9"]

  - id: plotinus-one
    label: "Plotinus’s One"
    kind: principle
    cluster: neoplatonic
    role: attractor
    description: >
      First hypostasis, beyond nous and beyond being. Direct philosophical
      intensification of the Platonic Good, now made the explicit source of
      procession (proodos) and the term of reversion (epistrophē).
    refs: ["Enneads VI.9", "Enneads V.1"]

  - id: psyche-neoplatonic
    label: "Neoplatonic Soul"
    kind: principle
    cluster: neoplatonic
    role: governor
    description: >
      Third hypostasis, looking up to Nous and down into nature. World Soul
      rewritten as a procession that can forget and must turn back.
    refs: ["Enneads IV.3", "Enneads IV.8"]

  - id: theurgy
    label: "Theurgy"
    kind: principle
    cluster: neoplatonic
    role: negative-feedback
    description: >
      Iamblichean / Chaldean ritual work that claims to return the soul by divine
      action rather than by contemplation alone. Operational green path on the
      late-antique spine.
    refs: ["Iamblichus, De Mysteriis"]

  - id: orphic-dionysus
    label: "Orphic Dionysus"
    kind: principle
    cluster: orphic
    description: >
      Zagreus dismembered by the Titans and reconstituted. Native Hellenic myth of
      sparagmos and return — red then green — and a source for the soma-sēma reading
      that V8 sets against the Receptacle.
    refs: ["Orphic fragments (Kern / Bernabé)"]

  - id: age-of-exile
    label: "Age of exile"
    kind: principle
    cluster: platonic
    description: >
      Longing and fragmentation after the cut. Platonic exile episode; collides
      with, but is not identical to, Gnostic fallen time.
    refs: ["Symposium 191a–d", "Statesman 273c–e"]

  - id: becoming
    label: "Becoming"
    kind: principle
    cluster: platonic
    role: plant
    description: >
      The generated cosmos and the mortal living things copied into the Receptacle:
      body, particulars, the realm of genesis. Output of the Demiurgic operation;
      starting point of erotic ascent.
    refs: ["Timaeus 27d–28a", "Timaeus 41a–42e"]

  - id: demiurge
    label: "Demiurge"
    kind: principle
    cluster: platonic
    role: controller
    description: >
      Divine craftsman / nous. Good, without jealousy, who brings order out of
      visible disorder by looking to the eternal model and persuading necessity as
      far as possible. Not the highest principle; an intellect that serves the Good.
    refs: ["Timaeus 28a–30a", "Timaeus 47e–48a"]

  - id: eros
    label: "Eros"
    kind: principle
    cluster: platonic
    role: negative-feedback
    description: >
      Not a stage but the return operator. Symposium: daimōn in the between, binding
      mortal to immortal along the ladder of beauty. Timaeus: philia among the
      elements that keeps the body of the world from dissolving. Green by default —
      cosmic love as integrative feedback.
    refs: ["Symposium 202d–212a", "Timaeus 32b–c"]

  - id: golden-age-cronus
    label: "Golden Age of Cronus"
    kind: principle
    cluster: platonic
    role: regime
    description: >
      Statesman / Hesiodic abundance under the steersman. A Platonic narrative
      episode, not stage 3 of a universal spine.
    refs: ["Statesman 271c–272d"]

  - id: intelligible-paradigm
    label: "Intelligible Paradigm"
    kind: principle
    cluster: platonic
    role: model
    description: >
      The eternal Living Creature (autozōon) that contains all intelligible living
      things — the paradeigma the Demiurge looks to. Not a craftsman and not yet a
      world: the formal inventory of what a complete cosmos must include.
    refs: ["Timaeus 28a–29a", "Timaeus 30c–31b"]

  - id: ordered-time
    label: "Ordered Time"
    kind: principle
    cluster: platonic
    role: clock
    description: >
      Time as the moving image of eternity, generated together with the heavens so
      that the World Soul’s numerable revolutions can imitate the abiding life of
      the paradigm. Includes the celestial gods as visible time-keepers.
    refs: ["Timaeus 37c–39e"]

  - id: receptacle
    label: "Receptacle"
    kind: principle
    cluster: platonic
    role: noise
    description: >
      Chōra: the third kind — space, nurse, and seat of becoming. Together with
      anankē (necessity) and the wandering cause, it is the condition that receives
      form without itself being a Form. Not evil; resistant.
    refs: ["Timaeus 48a–53b"]

  - id: spherical-humans
    label: "Primal spherical humans"
    kind: principle
    cluster: platonic
    description: >
      Aristophanes’ whole, spherical beings in the Symposium. Local myth of original
      sufficiency, not a metaphysical hypostasis.
    refs: ["Symposium 189c–193d"]

  - id: statesman-cycle
    label: "Statesman Cycle"
    kind: principle
    cluster: platonic
    role: regime-switch
    description: >
      Myth of the two cosmic epochs (Statesman 269c–274e). When the divine steersman
      holds the helm the world is guided; when he lets go it runs on its own stored
      motion and gradually forgets. Native Platonic account of run-down, reversal,
      and re-seizure of control.
    refs: ["Statesman 269c–274e"]

  - id: the-good
    label: "The Good"
    kind: principle
    cluster: platonic
    role: attractor
    description: >
      Highest principle of the Republic, epekeina tēs ousias — beyond being — source
      of intelligibility and of the being of the Forms. In the Timaean system it is
      the final cause the Demiurge consults when he looks to what is best.
      Cybernetically: the reference attractor of the whole hierarchy.
    refs: ["Republic 508e–509b", "Timaeus 29e–30a"]

  - id: world-soul
    label: "World Soul"
    kind: principle
    cluster: platonic
    role: governor
    description: >
      Intermediate, self-moving soul blended from Being, Same, and Other, stretched
      through the cosmic body. Binds intellect to becoming and carries the two
      circles that underwrite celestial order. Cybernetically: the homeostat of the
      cosmos.
    refs: ["Timaeus 34b–36d"]

  - id: zeus-division
    label: "Zeus’s division"
    kind: principle
    cluster: platonic
    role: symmetry-breaking
    description: >
      The cut that introduces duality and lack. Platonic narrative of symmetry
      breaking; peer to scientific symmetry-breaking, not its cause.
    refs: ["Symposium 190c–191a", "Statesman (Zeus epoch)"]

  - id: limiters-unlimiteds
    label: "Limiters and Unlimiteds"
    kind: principle
    cluster: pythagorean
    role: model
    description: >
      Philolaus’s pair: nothing knowable without both limiters and unlimiteds.
      The fitted pair is the cosmos, not a craftsman looking at Forms.
    refs: ["Philolaus B1", "Philolaus B6"]

  - id: harmonia
    label: "Harmonia"
    kind: principle
    cluster: pythagorean
    role: governor
    description: >
      The fitting-together of unlike limiters and unlimiteds (also musical
      ratio). Immanent bind, not a Demiurge persuading necessity.
    refs: ["Philolaus B6", "Aristotle, Metaphysics A5"]

  - id: hekhalot-ascent
    label: "Hekhalot Ascent"
    kind: principle
    cluster: jewish-mystical
    role: negative-feedback
    description: >
      Journey through seven palaces to the chariot-throne. The texts often say
      “descent.” Terrifying angels, seals, and song — not Symposium eros and
      not sefirotic cascade.
    refs: ["Hekhalot Rabbati", "Hekhalot Zutarti", "Maaseh Merkabah"]

  - id: merkabah-throne
    label: "Merkabah Throne"
    kind: principle
    cluster: jewish-mystical
    role: attractor
    description: >
      Ezekiel’s chariot-throne and the kavod seated in the innermost palace.
      Summit as a seen Glory, not an Ein Sof beyond predication.
    refs: ["Ezekiel 1", "Hekhalot Rabbati"]

  - id: metatron
    label: "Metatron"
    kind: principle
    cluster: jewish-mystical
    role: governor
    description: >
      Enoch transformed into the Prince of the Presence / Lesser YHWH (3 Enoch).
      Human become throne-side operator. Not the Johannine Logos and not a sefirah.
    refs: ["3 Enoch (Sefer Hekhalot)", "Genesis 5:24"]

  - id: necessary-existent
    label: "Necessary Existent"
    kind: principle
    cluster: islamic
    role: attractor
    description: >
      Avicenna’s wājib al-wujūd: that whose essence is to exist. Summit as
      necessary being, not the Good beyond being and not an unmoved thought
      thinking itself only.
    refs: ["Avicenna, Shifa Ilahiyyat I.6–7", "Avicenna, Najat"]

  - id: fana-baqa
    label: "Fana and Baqa"
    kind: principle
    cluster: sufi
    role: negative-feedback
    description: >
      Passing-away of the self and subsistence in God (Junayd). Return by
      annihilation, then a sober return to the senses. One node for the pair.
    refs: ["Junayd (Abdel-Kader)", "Iranica, Baqa wa Fana"]

  - id: aristotle-unmoved-mover
    label: "Unmoved Mover"
    kind: principle
    cluster: scientific
    role: attractor
    description: >
      Aristotle’s god as final cause that moves as beloved. Inherits the
      Good-as-attractor while rejecting separate Forms and a craftsman who looks to
      a model. Gold + magenta at once.
    refs: ["Metaphysics Λ", "Physics VIII"]

  - id: attractor
    label: "Dynamical Attractor"
    kind: principle
    cluster: scientific
    role: attractor
    description: >
      Region of phase space toward which trajectories converge. Formal isomorphism
      of the Good (and of any later summit that functions as a basin), without the
      ethical loading of to agathon.
    refs: ["dynamical systems (standard)"]

  - id: cybernetic-feedback
    label: "Cybernetic Feedback"
    kind: principle
    cluster: scientific
    role: governor
    description: >
      Wiener / Ashby: circular causation, required variety, homeostatic set-points.
      The explicit control-theoretic language onto which V6 maps World Soul, Eros,
      and the Statesman cycle.
    refs: ["Wiener, Cybernetics", "Ashby, Introduction to Cybernetics"]

  - id: entropy
    label: "Entropy"
    kind: principle
    cluster: scientific
    role: positive-feedback
    description: >
      Thermodynamic (and, loosely, informational) tendency toward equipartition and
      loss of free energy / constraint. Scientific name for the wandering cause when
      it is not persuaded — V6’s red arrow.
    refs: ["Clausius", "2nd law"]

  - id: hegel-geist
    label: "Hegelian Geist"
    kind: principle
    cluster: scientific
    role: negative-feedback
    description: >
      Spirit that externalises and returns to itself. Philosophical maximisation of
      Platonic epistrophē / erotic return, now as historical dialectic rather than
      as ascent of a single soul.
    refs: ["Phenomenology of Spirit", "Science of Logic"]

  - id: information
    label: "Information / Constraint"
    kind: principle
    cluster: scientific
    role: model
    description: >
      Difference that makes a difference; reduction of possibility space. Isomorph
      of Forms-as-constraints — the paradigm read as a specification rather than as
      a living intelligible animal.
    refs: ["Shannon", "Bateson"]

  - id: kant-noumenon
    label: "Kantian Noumenon"
    kind: principle
    cluster: scientific
    role: model
    description: >
      Thing-in-itself as the thought of a ground we cannot know. Occupies the
      paradigm slot epistemically inverted: the model is no longer the most
      knowable, but the limit of knowledge (V3, V11-adjacent).
    refs: ["Critique of Pure Reason, A235–260 / B294–315"]

  - id: negentropy
    label: "Negentropy"
    kind: principle
    cluster: scientific
    role: negative-feedback
    description: >
      Schrödinger’s local export of entropy: living (and, here, cosmic) order
      maintained by constraint and throughput. Scientific green name for Demiurgic
      persuasion and World-Soul binding.
    refs: ["Schrödinger, What is Life?"]

  - id: self-organization
    label: "Self-Organization"
    kind: principle
    cluster: scientific
    description: >
      Order arising from local interaction without an external craftsman. Cyan to
      World Soul (immanent binding); magenta to the Demiurge (no separate nous
      looking at a paradigm).
    refs: ["Prigogine", "Kauffman"]

  - id: spinoza-deus
    label: "Spinoza’s Deus sive Natura"
    kind: principle
    cluster: scientific
    description: >
      One substance, immanent cause of itself. Absorbs Good, paradigm, and world
      into a single geometric necessity. Isomorphic as monism; contrast as the
      refusal of a craftsman and of a beyond-being.
    refs: ["Ethics I"]

  - id: stoic-logos
    label: "Stoic Logos"
    kind: principle
    cluster: scientific
    role: governor
    description: >
      Immanent fiery reason that structures and recurs through the cosmos (including
      ekpyrōsis). World Soul stripped of a separate paradigm and made identical with
      the world’s active principle.
    refs: ["SVF fragments", "Marcus Aurelius, Meditations"]

  - id: symmetry-breaking
    label: "Symmetry Breaking"
    kind: principle
    cluster: scientific
    description: >
      Selection of a particular ordered state from a more symmetric possibility
      space. Scientific analogue of the Demiurge imposing definite triangles /
      elements on the Receptacle’s indeterminacy.
    refs: ["Anderson; modern cosmology / condensed matter"]

  - id: whitehead-process
    label: "Whiteheadian Process"
    kind: principle
    cluster: scientific
    role: plant
    description: >
      Actual occasions, prehension, and a God who is both primordial and consequent.
      Becoming promoted from last stage to the general category; the Receptacle
      rewritten as extensive continuum.
    refs: ["Process and Reality"]

  - id: zoroastrian-dualism
    label: "Zoroastrian Dualism"
    kind: principle
    cluster: zoroastrian
    description: >
      Ahura Mazda against Angra Mainyu as coeval or quasi-coeval principles.
      Contrast with Plato’s single Good plus a *non-evil* necessity: here the
      opposing pole is itself a will, not a receptacle.
    refs: ["Gathas", "later Avestan / Pahlavi"]

  - id: ahura-mazda
    label: "Ahura Mazda"
    kind: principle
    cluster: zoroastrian
    role: attractor
    description: >
      Lord of Wisdom. Uncreated source of asha and of the Amesha Spentas.
      In the Gathas more ethical summit than a combat craftsman; later the
      good pole of a cosmic war.
    refs: ["Gathas", "Yasna"]

  - id: angra-mainyu
    label: "Angra Mainyu"
    kind: principle
    cluster: zoroastrian
    role: positive-feedback
    description: >
      Destructive / opposing spirit. Chooses druj. In later texts a coeval
      or near-coeval will against Mazda. Not leftover chōra.
    refs: ["Gathas (twin mainyus)", "later Avestan / Pahlavi"]

  - id: asha
    label: "Asha"
    kind: principle
    cluster: zoroastrian
    role: clock
    description: >
      Truth, rightness, cosmic order. Cognate of Vedic ṛta. The path that
      must be chosen and kept.
    refs: ["Gathas", "Asha Vahishta in Younger Avesta"]

  - id: druj
    label: "Druj"
    kind: principle
    cluster: zoroastrian
    role: noise
    description: >
      The Lie: distortion, chaos, falsehood. Opposite of asha. Ethical and
      cosmic, not a slain sea.
    refs: ["Gathas"]

  - id: amesha-spentas
    label: "Amesha Spentas"
    kind: principle
    cluster: zoroastrian
    role: model
    description: >
      Heptad of undying aspects of Mazda (Vohu Manah, Asha Vahishta, and
      the rest). One node for the set, not seven. Later archangel-like;
      in the Gathas still facets of Wisdom.
    refs: ["Yasna Haptanghaiti", "Younger Avesta"]

  - id: zurvan
    label: "Zurvan"
    kind: principle
    cluster: zoroastrian
    role: clock
    description: >
      Infinite Time in later Zurvanite reading: parent of the twins Ohrmazd
      and Ahriman. Time as the highest, not as a moving image of eternity.
    refs: ["Pahlavi Zurvan mythology"]

  - id: father-of-greatness
    label: "Father of Greatness"
    kind: principle
    cluster: manichaean
    role: attractor
    description: >
      Uncreated sovereign of the World of Light (Abbā dəRabbūṯā). Iranian texts
      may name him Zurwān, but he is one pole of the dual formula, not the parent
      of twin spirits.
    refs:
      - "Kephalaia"
      - "Theodore bar Konai"
      - "Gnoli, Encyclopedia of Religion"

  - id: king-of-darkness
    label: "King of Darkness"
    kind: principle
    cluster: manichaean
    role: prison
    description: >
      Uncreated Prince of Darkness / Hylē / Matter. Coeval with the Father, not
      a fallen aeon and not leftover chōra. Invasion of Light starts the mixture.
    refs:
      - "Theodore bar Konai"
      - "Kephalaia"
      - "Gnoli, Encyclopedia of Religion"

  - id: primal-man
    label: "Primal Man"
    kind: principle
    cluster: manichaean
    role: plant
    description: >
      First evocation (Nāšā Qaḏmāyā). Sent with five light-elements, swallowed
      by Darkness. Iranian texts call him Ohrmazd — the good spirit recast as
      the wounded proto-anthropos, not as the uncreated summit.
    refs:
      - "Theodore bar Konai"
      - "Kephalaia"
      - "Gnoli, Encyclopedia of Religion"

  - id: living-spirit
    label: "Living Spirit"
    kind: principle
    cluster: manichaean
    role: controller
    description: >
      Second evocation. Rescues Primal Man and fashions heavens and earths from
      the corpses of the dark powers — a good extraction-machine, not an ignorant
      prison-maker.
    refs:
      - "Theodore bar Konai"
      - "Kephalaia"
      - "Gnoli, Encyclopedia of Religion"

  - id: third-messenger
    label: "Third Messenger"
    kind: principle
    cluster: manichaean
    role: negative-feedback
    description: >
      Third evocation (the Messenger / Great Nous). Extracts swallowed light by
      display and later judgment. Return operator for the mixture; not the
      Johannine incarnate Logos.
    refs:
      - "Theodore bar Konai"
      - "Kephalaia"
      - "Gnoli, Encyclopedia of Religion"

  - id: manichaean-mixture
    label: "Manichaean Mixture"
    kind: principle
    cluster: manichaean
    role: positive-feedback
    description: >
      Present age: light particles trapped in matter, bodies, and rebirth.
      The middle of the three times. Fall as invasion-and-swallowing, not as
      an aeon’s error inside a pleroma.
    refs:
      - "Chinese Compendium (three stages)"
      - "Augustine, Contra Felicem (initium, medium, finis)"
      - "Gnoli, Encyclopedia of Religion"

  - id: manichaean-three-times
    label: "Manichaean Three Times"
    kind: principle
    cluster: manichaean
    role: clock
    description: >
      Former separation, present mixture, future re-separation. Cosmic history
      as the doctrine itself, not time as a moving image of eternity and not
      Zurvan as parent of twins.
    refs:
      - "Chinese Compendium (prior / middle / posterior)"
      - "Augustine, Contra Felicem"
      - "Kephalaia"

  - id: hayyi-rabbi
    label: "Hayyi Rabbi"
    kind: principle
    cluster: mandaean
    role: attractor
    description: >
      The Great Life / First Life (also Lord of Greatness, King of Light).
      Uncreated summit of the World of Light. Symbol is living water. Does
      not fashion Tibil; that work is delegated down the Lives.
    refs:
      - "Right Ginza"
      - "Rudolph, Iranica MANDAEANS ii"
      - "Qolasta (opening: in the name of the Great Life)"

  - id: yushamin
    label: "Yushamin"
    kind: principle
    cluster: mandaean
    role: positive-feedback
    description: >
      Second Life. Primal uthra who acts in creation without consulting the
      First Life (Right Ginza 3; Book of John 1–10). Prototype of a priest
      who errs and can be reconciled. Not Ruha and not Sophia expelled.
    refs:
      - "Right Ginza 3"
      - "Mandaean Book of John 1–10"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: abatur
    label: "Abatur"
    kind: principle
    cluster: mandaean
    role: governor
    description: >
      Third Life. Weighs souls on the threshold of the Lightworld against
      Šitil. Demoted from 'elevated' to lord of the scales until the end.
      Father of Ptahil in the Four Lives chain.
    refs:
      - "Diwan Abatur"
      - "Mandaean Book of John 70–72"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: ptahil
    label: "Ptahil"
    kind: principle
    cluster: mandaean
    role: controller
    description: >
      Fourth Life. Uthra-craftsman of Tibil. Makes the earth with help from
      Ruha and cannot give Adam a soul; Life must send it. Not Yaldabaoth
      and not a successful extraction-machine.
    refs:
      - "Right Ginza"
      - "Rudolph, Iranica MANDAEANS ii"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: ruha
    label: "Ruha"
    kind: principle
    cluster: mandaean
    role: prison
    description: >
      Queen of the World of Darkness (with Ur). Mother of the Seven and the
      Twelve. Helps Ptahil make Tibil and the body; the soul is not hers.
      Personified spirit, not the higher soul (nišimta).
    refs:
      - "Right Ginza 3"
      - "Rudolph, Iranica MANDAEANS ii"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: yardna
    label: "Yardna"
    kind: principle
    cluster: mandaean
    role: model
    description: >
      Running "Jordan": any baptismal river as Lightworld water on earth.
      Not chaos-water and not a slain first sea. Hayyi's symbol; the
      medium of masbuta.
    refs:
      - "Qolasta (masbuta liturgy)"
      - "Rudolph, Iranica MANDAEANS ii"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: masbuta
    label: "Masbuta"
    kind: principle
    cluster: mandaean
    role: negative-feedback
    description: >
      Repeated full immersion in yardna. Cleanses and makes a laufa
      (connection) to the Lightworld while still in Tibil. Horizontal
      counterpart of the death-ascent (masiqta), not a one-time Christian
      washing and not exit-gnosis.
    refs:
      - "Qolasta (Drower, Canonical Prayerbook, baptism)"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"
      - "Rudolph, Iranica MANDAEANS ii"

  - id: manda-d-hayyi
    label: "Manda d-Hayyi"
    kind: principle
    cluster: mandaean
    role: exit
    description: >
      Knowledge of Life. Dominant envoy who reveals to Adam his Lightworld
      origin so the soul can return. Not the Johannine Logos and not a
      historical founder. Hibil, Šitil, and Anōš stay unnamed as a list.
    refs:
      - "Right Ginza"
      - "Rudolph, Iranica MANDAEANS ii"
      - "Buckley, Mandaean Religion (Encyclopedia of Religion)"

  - id: ginnungagap
    label: "Ginnungagap"
    kind: principle
    cluster: norse
    role: noise
    description: >
      Yawning void before sea, earth, or heaven (Völuspá 3). In Gylfaginning
      the mild middle where Muspell’s heat meets Niflheim’s rime and life
      drips into a form. Not a nurse and not a slain first water.
    refs:
      - "Völuspá 3"
      - "Gylfaginning 4–5"

  - id: ymir
    label: "Ymir"
    kind: principle
    cluster: norse
    role: noise
    description: >
      First being of the gap. Burr’s sons slay him; earth, sea, sky, and
      Midgard are made from the corpse (Gylfaginning 8; Grímnismál 40–41).
      Matter as a defeated body, not a remaining sea.
    refs:
      - "Völuspá 3"
      - "Gylfaginning 5–8"
      - "Grímnismál 40–41"

  - id: sons-of-burr
    label: "Sons of Burr"
    kind: principle
    cluster: norse
    role: controller
    description: >
      Odin, Vili, and Vé. Lift the land and make Midgard (Völuspá 4); slay
      Ymir and fashion the world from the body. Craftsmen by combat, not a
      dump of the whole Æsir.
    refs:
      - "Völuspá 4"
      - "Gylfaginning 6–8"
      - "Lokasenna 26 (Vili and Vé named)"

  - id: yggdrasil
    label: "Yggdrasil"
    kind: principle
    cluster: norse
    role: model
    description: >
      World-ash, evergreen over Urðr’s well. Holds the nine worlds; dews
      fall from it; it shakes when the end comes. Order as a living tree
      that must be watered, not a once-for-all paradigm.
    refs:
      - "Völuspá 2, 19, 47"
      - "Gylfaginning 15–16"
      - "Grímnismál 29–35"

  - id: wyrd
    label: "Wyrd / Urðr"
    kind: principle
    cluster: norse
    role: clock
    description: >
      Fate scored by the three maidens under the tree (Urðr, Verðandi,
      Skuld). They allot life and set fates. Not time as an image of
      eternity and not a mandate that can be withdrawn.
    refs:
      - "Völuspá 20"
      - "Gylfaginning 15"

  - id: ragnarok
    label: "Ragnarök"
    kind: principle
    cluster: norse
    role: positive-feedback
    description: >
      Fate of the gods: wolf free, tree shakes, earth sinks, fire licks
      heaven (Völuspá 44–57). The gods die with the world. Not a steersman
      letting go of a cosmos that continues.
    refs:
      - "Völuspá 44–57"
      - "Gylfaginning (Surtr / Fenrir)"

  - id: earth-risen
    label: "Earth risen"
    kind: principle
    cluster: norse
    role: negative-feedback
    description: >
      After the fire, a green earth rises from the waves; unsown fields
      bear fruit; surviving gods meet at Ithavoll (Völuspá 59–62). Return
      as a new ground, not tikkun of shattered vessels.
    refs:
      - "Völuspá 59–62"

  - id: sky-sea-stillness
    label: "Sky-sea stillness"
    kind: principle
    cluster: mesoamerican
    role: noise
    description: >
      Opening of the Popol Vuh: sky empty, sea murmuring, nothing yet named.
      The makers are already in the water. First given as hush, not a slain
      deep and not a yawning northern gap.
    refs:
      - "Popol Vuh, primordial world (Tedlock / Christenson)"

  - id: heart-of-sky
    label: "Heart of Sky"
    kind: principle
    cluster: mesoamerican
    role: controller
    description: >
      Huracán and the thunderbolt triad. Speaks the earth up from the sea
      with the Plumed Serpent; floods the wood people when they will not
      praise. Craftsman by word and storm, not a lone Demiurge.
    refs:
      - "Popol Vuh (Tedlock, Heart of Sky / Hurricane)"
      - "Christenson, Popol Vuh"

  - id: plumed-serpent
    label: "Sovereign Plumed Serpent"
    kind: principle
    cluster: mesoamerican
    role: controller
    description: >
      Qʼuqʼumatz in the water, enclosed in quetzal blue-green. Maker and
      modeler who confers with Heart of Sky. Tedlock reads Tepeu as a title,
      not a second god. Not a Mexica Quetzalcoatl node.
    refs:
      - "Popol Vuh (Tedlock, Sovereign Plumed Serpent)"
      - "Christenson, Popol Vuh"

  - id: failed-people
    label: "Failed people"
    kind: principle
    cluster: mesoamerican
    role: positive-feedback
    description: >
      Mud bodies crumble; wood manikins walk and multiply with nothing in
      heart or mind. Heart of Sky floods them and the animals tear the rest.
      A discarded design, not a spark-prison.
    refs:
      - "Popol Vuh, first and second human attempts (Tedlock)"
      - "Christenson, Popol Vuh"

  - id: maize-people
    label: "Maize people"
    kind: principle
    cluster: mesoamerican
    role: plant
    description: >
      Humans ground from yellow and white maize at Paxil / Cayalá. They can
      keep the days and name the makers. Sight is then dimmed so they are not
      gods. Matter as food-body, not leftover deficiency.
    refs:
      - "Popol Vuh, fourth creation (Tedlock)"
      - "Smithsonian NMAI, Creation Story of the Maya"

  - id: hero-twins
    label: "Hero Twins"
    kind: principle
    cluster: mesoamerican
    role: negative-feedback
    description: >
      Hunahpu and Xbalanque. Descend to Xibalba, outplay One and Seven Death,
      rise as sun and moon, and clear the road for maize people. Return by
      trick, not exit-gnosis.
    refs:
      - "Popol Vuh, Hunahpu and Xbalanque (Tedlock)"
      - "Christenson, Popol Vuh"

  - id: xibalba
    label: "Xibalba"
    kind: principle
    cluster: mesoamerican
    role: prison
    description: >
      Place of Fright. Underworld court of One and Seven Death; houses of
      trial and a ballcourt that kills. The twins empty its claim. Not kenoma
      and not a remaining first water.
    refs:
      - "Popol Vuh, Xibalba (Tedlock)"
      - "Christenson, Popol Vuh"

  - id: olodumare
    label: "Olodumare"
    kind: principle
    cluster: yoruba
    role: attractor
    description: >
      Supreme owner of the source that does not empty. Remote, unculted
      directly; breathes life and delegates earth-work. Not a Timaean
      craftsman and not a gendered Bible-God.
    refs:
      - "Idowu, Olódùmarè: God in Yoruba Belief"
      - "Odù Ifá"
      - "Abimbola, Yoruba Culture (Olodumare without gender in Ifá)"

  - id: olokun
    label: "Olokun"
    kind: principle
    cluster: yoruba
    role: noise
    description: >
      Owner of the first waters under the sky. The given before sand is
      poured at Ilé-Ifẹ̀. Can flood the new land. Not a slain first deep.
    refs:
      - "Idowu, Olódùmarè: God in Yoruba Belief"
      - "Yoruba creation cycle (Obatala / Oduduwa descent)"

  - id: obatala
    label: "Obatala"
    kind: principle
    cluster: yoruba
    role: controller
    description: >
      Òrìṣà-ńlá, sent with chain, sand, and hen to make land. Drinks palm
      wine; Oduduwa finishes the earth. Then sculpts human bodies; Olodumare
      breathes. Sculptor, not the remote summit.
    refs:
      - "Idowu, Olódùmarè: God in Yoruba Belief"
      - "Odù Ifá / Ifá theology of Obatala and Oduduwa"

  - id: oduduwa
    label: "Oduduwa"
    kind: principle
    cluster: yoruba
    role: controller
    description: >
      Completes the descent at Ilé-Ifẹ̀: sand on the waters, hen scatters
      dry land. Earth-maker after Obatala’s delay. Not every later Ọọ̀ni
      king-list.
    refs:
      - "Idowu, Olódùmarè: God in Yoruba Belief"
      - "Ifá theology (Oduduwa at Ilé-Ifẹ̀)"

  - id: orunmila
    label: "Orunmila"
    kind: principle
    cluster: yoruba
    role: model
    description: >
      Ẹlẹ́rìí ìpín: witness of creation and of destiny. Voice of the Ifá
      corpus. Counsel at the making; not the tablet seized in combat and
      not a hidden Nous.
    refs:
      - "Abimbola, Ifá: An Exposition of Ifá Literary Corpus"
      - "Odù Ifá"

  - id: ori
    label: "Ori"
    kind: principle
    cluster: yoruba
    role: clock
    description: >
      Inner head. Destiny chosen before birth; Orunmila witnesses the
      choice. Not a mandate Heaven withdraws and not fate scored by three
      maidens under a tree.
    refs:
      - "Abimbola, Ifá: An Exposition of Ifá Literary Corpus (ori)"
      - "Odù Ifá"

  - id: ase
    label: "Àṣẹ"
    kind: principle
    cluster: yoruba
    role: governor
    description: >
      Power to make what is said happen. Olodumare owns it; speech, ritual,
      and orisha work by it. Efficacy as a transferable force, not a Form
      contemplated.
    refs:
      - "Idowu, Olódùmarè: God in Yoruba Belief"
      - "Abimbola, Yoruba Culture"

  - id: brahma
    label: "Brahmā"
    kind: principle
    cluster: hindu
    role: controller
    description: >
      Lotus-born kalpa-creator of the trimūrti. Rajas portion of Brahman
      (Maitrī 5.2). In Devī Māhātmya 1 he is already at work when Madhu and
      Kaitabha rise; he must praise the Goddess so Viṣṇu will wake. Junior
      craftsman, not a widely culted summit.
    refs:
      - "Maitrī Upaniṣad 5.2"
      - "Devī Māhātmya 1 (Coburn)"
      - "Flood, An Introduction to Hinduism"

  - id: vishnu
    label: "Viṣṇu"
    kind: principle
    cluster: hindu
    role: governor
    description: >
      Preserver. Sattva portion of Brahman (Maitrī 5.2). Ṛgvedic three-strider
      (RV 1.154) who later descends when dharma wanes (Gītā 4.7–8) and sleeps
      as Nārāyaṇa until Devī withdraws. Operator of maintenance and descent,
      not a dashāvatāra catalogue.
    refs:
      - "Ṛgveda 1.154"
      - "Maitrī Upaniṣad 5.2"
      - "Bhagavad Gītā 4.7–8"
      - "Devī Māhātmya 1 (Coburn)"

  - id: shiva
    label: "Śiva"
    kind: principle
    cluster: hindu
    role: clock
    description: >
      Dissolver who recycles the kalpa. Tamas portion of Brahman under the
      older name Rudra (Maitrī 5.2). Auspicious yogi and fierce ender in one
      operator. Not every local Īśvara and not a linga-icon dump.
    refs:
      - "Maitrī Upaniṣad 5.2"
      - "Śvetāśvatara Upaniṣad 3.2"
      - "Flood, An Introduction to Hinduism"
      - "Devī Māhātmya 2 (tejas of the gods)"

  - id: devi
    label: "Devī"
    kind: principle
    cluster: hindu
    role: attractor
    description: >
      Mahādevī of the Devī Māhātmya: Mahāmāyā who is Viṣṇu's sleep and the
      tejas-body that slays Mahiṣa. Summit that also fights. One operator,
      not Kālī, Durgā, and the Mātṛkās as separate nodes.
    refs:
      - "Devī Māhātmya (Mārkaṇḍeya Purāṇa 81–93)"
      - "Coburn, Encountering the Goddess"
      - "Kinsley, Hindu Goddesses"

  - id: maya
    label: "Māyā (adhyāsa)"
    kind: principle
    cluster: hindu
    role: noise
    description: >
      Śaṅkara's adhyāsa/avidyā: the world as mithyā name-and-form on Brahman.
      Appearance, not a second summit and not Devī as a fighting goddess.
      Less-than-real overlay, not Sāṃkhya's real prakṛti.
    refs:
      - "Śaṅkara, Adhyāsa-bhāṣya on the Brahma-sūtra"
      - "Brahma-sūtra-bhāṣya"

  - id: apaurusheya
    label: "Apauruṣeya"
    kind: principle
    cluster: hindu
    description: >
      Jaimini 1.1.1–5: dharma is what Vedic injunction (codanā) indicates.
      The Veda is eternal unauthored speech — cosmic ought without a
      speaker-god. Un-bags later dharma from ṛta-as-clock.
    refs:
      - "Mīmāṃsā-sūtra 1.1.1–5"
      - "Śabara-bhāṣya"

  - id: paramanu
    label: "Paramāṇu"
    kind: principle
    cluster: hindu
    description: >
      Kaṇāda's indivisible eternal particulars. Their combinations, not a
      nurse-space, make the empirical world. Atom as occupant, not kalām
      (left out of Islamic philosophy) and not chōra.
    refs:
      - "Vaiśeṣika-sūtra"

  - id: kaivalya
    label: "Kaivalya"
    kind: principle
    cluster: hindu
    role: exit
    description: >
      Yoga-sūtra 4.34: when the guṇas lapse the seer stands alone in its
      nature. Liberation as isolation, not identity with Brahman, not exit
      from the cosmos, and not a redo of the Sāṃkhya pair.
    refs:
      - "Yoga-sūtra 4.34"

  - id: nyaya-ishvara
    label: "Nyāya Īśvara"
    kind: principle
    cluster: hindu
    role: controller
    description: >
      Inferred intelligent agent who guides atoms, karma, and earth
      (Uddyotakara NV 4.1.21; Udayana kāryatvāt). Designer from products,
      not lotus-born Brahmā, not Śiva as local Īśvara, not Yoga's special
      puruṣa, and not the unmoved mover.
    refs:
      - "Nyāya-sūtra 4.1.21"
      - "Uddyotakara, Nyāya-vārttika 4.1.21"
      - "Udayana, Nyāyakusumāñjali"

  - id: blombos-mark
    label: "Blombos mark"
    kind: principle
    cluster: preliterate
    role: information
    description: >
      Deliberate geometric incisions and ochre drawing at Blombos Cave (South
      Africa), c. 100–73 ka. Cross-hatch and related patterns. Not language.
      Salvageable slot: a mark that is made on purpose and can carry difference.
    refs: ["Henshilwood et al. 2002/2009", "Henshilwood et al. 2018 Nature (73 ka drawing)"]

  - id: lion-man
    label: "Lion-man"
    kind: principle
    cluster: preliterate
    description: >
      Löwenmensch of Hohlenstein-Stadel: mammoth-ivory being with a cave-lion
      head and a human stance, c. 40–35 ka. Oldest confirmed sculpture of a
      thing that does not exist in nature. Salvageable slot: hybrid / other-than-
      human person. Ivory, not stone.
    refs: ["Ulm Museum / UNESCO Swabian Jura", "British Museum, The Lion Man"]

  - id: gobekli-tepe
    label: "Göbekli Tepe"
    kind: principle
    cluster: preliterate
    description: >
      Flagship PPN enclosure complex in SE Anatolia, c. 9600–8000 BCE. T-pillars
      carved as abstracted bodies with animal reliefs. First large stone imagery
      we can date. Sanctuary versus settlement still argued.
    refs: ["Klaus Schmidt", "Banning 2011", "Dietrich et al. 2019 PLOS ONE"]

  - id: lepenski-fish-image
    label: "Lepenski fish-human"
    kind: principle
    cluster: preliterate
    description: >
      Sandstone sculptures from Lepenski Vir with human faces and fish traits,
      set at house hearths, peak c. 6300–6000 BCE. Europe’s earliest monumental
      stone figures. Salvageable slot: river-being; hybrid like the Lion-man,
      carved in stone, later, and tied to the house.
    refs: ["National Museum of Serbia", "Radovanović, The Iron Gates Mesolithic"]

  - id: nabta-playa
    label: "Nabta Playa"
    kind: principle
    cluster: preliterate
    role: clock
    description: >
      Saharan stone setting in southern Egypt. Occupation from c. 7500 BCE; the
      small calendar circle is often dated later (5th–4th millennium). Seasonal
      or solstice mark, not a cosmogony. Time/sky slot only.
    refs: ["McKim Malville et al. on Nabta Playa", "Astronomy.com summary 2020"]

  - id: vinca-signs
    label: "Vinča signs"
    kind: principle
    cluster: preliterate
    role: information
    description: >
      Recurring incised signs on Vinča pottery and figurines. Household notation
      or potters’ marks, not a deciphered language and not older Sumerian
      writing. Salvageable slot: a repeatable sign-set without a readable myth.
    refs: ["Starović 2005, Documenta Praehistorica", "Vinča symbols (standard archaeological caution)"]

  - id: nammu
    label: "Nammu"
    kind: principle
    cluster: mesopotamian
    role: noise
    description: >
      Sumerian primeval sea who bears An and Ki. Water as the given before
      sky and earth are two. Nurse-like, not a slain chaos-dragon.
    refs: ["Gilgamesh, Enkidu, and the Netherworld prologue", "Kramer, Sumerian Mythology"]

  - id: anu
    label: "An / Anu"
    kind: principle
    cluster: mesopotamian
    role: attractor
    description: >
      Sky and high god. Occupies a summit slot without being a craftsman and
      without being beyond being. Authority more than intellect.
    refs: ["Enūma Eliš", "Sumerian temple hymns"]

  - id: enlil
    label: "Enlil"
    kind: principle
    cluster: mesopotamian
    role: symmetry-breaking
    description: >
      Separates An from Ki so a habitable interval exists. Kingship and
      weather sit here. The cut, not the model.
    refs: ["Gilgamesh, Enkidu, and the Netherworld", "Enlil in the E-kur"]

  - id: enki
    label: "Enki / Ea"
    kind: principle
    cluster: mesopotamian
    role: controller
    description: >
      Wisdom, Abzu, crafts, and the assigning of cosmic offices. Closest
      Sumerian occupant of a craftsman slot. In Enūma Eliš he slays Apsu
      before Marduk slays Tiamat.
    refs: ["ETCSL 1.1.3 Enki and the World Order", "Enūma Eliš tablets I–II"]

  - id: divine-me
    label: "Me"
    kind: principle
    cluster: mesopotamian
    role: model
    description: >
      The me: transferable divine powers that structure cosmos, craft, and
      city. Offices that can be gathered, stolen, and bestowed. Forms-as-
      functions, not a living intelligible animal.
    refs: ["ETCSL 1.1.3", "Inana and Enki (me list)"]

  - id: tiamat
    label: "Tiamat"
    kind: principle
    cluster: mesopotamian
    role: noise
    description: >
      Salt-water chaos in Enūma Eliš. Slain by Marduk; heavens and earth cut
      from her body. Matter as corpse of a defeated first being, not a nurse.
    refs: ["Enūma Eliš tablets IV–V", "Lambert 2013"]

  - id: marduk
    label: "Marduk"
    kind: principle
    cluster: mesopotamian
    role: controller
    description: >
      Babylon’s champion in Enūma Eliš. Builds the world from Tiamat, assigns
      offices, takes the Tablet of Destinies. Craftsman by combat, recited at
      Akitu as yearly re-seizure of order.
    refs: ["Enūma Eliš", "Akitu ritual context"]

  - id: tablet-of-destinies
    label: "Tablet of Destinies"
    kind: principle
    cluster: mesopotamian
    role: information
    description: >
      Object that confers the right to decree fate. Taken from Qingu and worn
      by Marduk. Legitimacy as a portable constraint, not a Form contemplated.
    refs: ["Enūma Eliš tablet IV", "Anzû myth (parallel tablet)"]

  - id: nun
    label: "Nun"
    kind: principle
    cluster: egyptian
    role: noise
    description: >
      Infinite dark water before anything stands. Atum rises from it. Nurse-sea,
      not a slain dragon and not a prison.
    refs: ["Pyramid Texts", "Heliopolitan cosmogony"]

  - id: atum
    label: "Atum"
    kind: principle
    cluster: egyptian
    role: controller
    description: >
      Self-created first of Heliopolis. Stands on the benben mound in Nun and
      produces the first pair (Shu, Tefnut). Summit and craftsman in one body;
      later fused with Re. Not encoded as the whole Ennead.
    refs: ["Pyramid Texts", "Heliopolitan Ennead"]

  - id: re
    label: "Re"
    kind: principle
    cluster: egyptian
    role: clock
    description: >
      Sun as daily death and rebirth. Night barque, dawn return. Time as a cycle
      that must be rowed, not a moving image of eternity.
    refs: ["Amduat", "solar hymns"]

  - id: osiris
    label: "Osiris"
    kind: principle
    cluster: egyptian
    description: >
      Murdered and dismembered king, gathered and made the first mummy. Fall
      then reconstitution inside this world; the dead king remains lord of the
      West, not an escapee. Horus as living successor stays in the myth, not
      as a separate node.
    refs: ["Pyramid Texts", "Plutarch, De Iside (late narrative)"]

  - id: isis
    label: "Isis"
    kind: principle
    cluster: egyptian
    role: negative-feedback
    description: >
      Gathers the scattered pieces and forces life back long enough for a
      successor. Return operator of the Osiris cycle.
    refs: ["Pyramid Texts", "Osiris myth"]

  - id: seth
    label: "Seth"
    kind: principle
    cluster: egyptian
    role: positive-feedback
    description: >
      Killer and usurper; isfet against Ma'at. Disorder as a will inside the
      cosmos, not a first water to be cut into sky and earth.
    refs: ["Osiris myth", "isfet / Ma'at theology"]

  - id: thoth
    label: "Thoth"
    kind: principle
    cluster: egyptian
    role: model
    description: >
      Writing, moon, measure, and the weighing of the heart. Speech and record
      as cosmic offices. Helps reassemble Osiris.
    refs: ["Book of the Dead spell 125", "Hermopolitan associations"]

  - id: amun
    label: "Amun"
    kind: principle
    cluster: egyptian
    role: attractor
    description: >
      The Hidden of Thebes. Summit by withdrawal of name, later Amun-Re.
      Intensifies transcendence without condemning the craftsman.
    refs: ["New Kingdom Amun theology", "Leiden hymns"]

  - id: shu
    label: "Shu"
    kind: principle
    cluster: egyptian
    role: symmetry-breaking
    description: >
      Air. Born of Atum with Tefnut; holds Nut (sky) off Geb (earth). The
      Heliopolitan cut that opens a world. Ennead actor, not a leftover god.
    refs: ["Pyramid Texts", "Heliopolitan Ennead"]

  - id: tefnut
    label: "Tefnut"
    kind: principle
    cluster: egyptian
    description: >
      Moisture. Twin of Shu, first pair from Atum. Ennead actor.
    refs: ["Pyramid Texts", "Heliopolitan Ennead"]

  - id: geb
    label: "Geb"
    kind: principle
    cluster: egyptian
    description: >
      Earth. Lies under Nut; father of the Osiris generation. Ennead actor.
    refs: ["Pyramid Texts", "Heliopolitan Ennead"]

  - id: nut
    label: "Nut"
    kind: principle
    cluster: egyptian
    description: >
      Sky vault arched over Geb. Swallows and births the sun. Ennead actor.
    refs: ["Pyramid Texts", "Heliopolitan Ennead"]

  - id: nephthys
    label: "Nephthys"
    kind: principle
    cluster: egyptian
    description: >
      Sister of Isis; mourns and helps gather Osiris. Last of the nine of
      Heliopolis. Ennead actor.
    refs: ["Pyramid Texts", "Osiris myth"]

  - id: rta
    label: "Ṛta"
    kind: principle
    cluster: vedic
    role: clock
    description: >
      Vedic rightness of the cosmos: the path of sun, sacrifice, and speech.
      Order that is kept, not a person. Closest peer to Ma'at.
    refs: ["Ṛgveda", "Macdonell, Vedic Mythology"]

  - id: vedic-purusha
    label: "Puruṣa (Puruṣasūkta)"
    kind: principle
    cluster: vedic
    description: >
      Cosmic person of Ṛgveda 10.90, dismembered in sacrifice so the world
      and the varṇas are made. Cosmos from a body, like Tiamat, but as offering
      not combat. Not the Sāṃkhya witness (`purusha-prakriti`).
    refs: ["Ṛgveda 10.90"]

  - id: prajapati
    label: "Prajāpati"
    kind: principle
    cluster: vedic
    role: controller
    description: >
      Lord of creatures. Late-Vedic / Brāhmaṇa creator who emits the world.
      Craftsman-adjacent, often by heat and speech, not by looking to Forms.
    refs: ["Ṛgveda 10.121 (hints)", "Brāhmaṇa Prajāpati myths"]

  - id: indra
    label: "Indra"
    kind: principle
    cluster: vedic
    role: governor
    description: >
      Storm-king of the Ṛgveda (most hymns). Slays Vṛtra, releases the waters.
      King of gods in this corpus, not a hidden summit.
    refs: ["Ṛgveda Indra hymns", "Vṛtra-killing"]

  - id: vrtra
    label: "Vṛtra"
    kind: principle
    cluster: vedic
    role: noise
    description: >
      Obstructor, serpent-dragon who pens the waters. Indra splits him.
      Combat-water, sibling of Yam and Tiamat.
    refs: ["Ṛgveda 1.32"]

  - id: agni
    label: "Agni"
    kind: principle
    cluster: vedic
    description: >
      Sacrificial fire, priest, and messenger between men and gods. Second
      in hymn-count. Mouth of the offering, not a craftsman of the cosmos.
    refs: ["Ṛgveda Agni hymns"]

  - id: soma
    label: "Soma"
    kind: principle
    cluster: vedic
    description: >
      Plant, drink, and god. Pressed and offered, especially to Indra.
      Ritual substance that is also a deity.
    refs: ["Ṛgveda maṇḍala 9"]

  - id: varuna
    label: "Varuṇa"
    kind: principle
    cluster: vedic
    description: >
      Guardian of ṛta, oaths, and the waters. Paired with Mitra, who is now
      his own node. Asura of bonds, not a slain sea.
    refs: ["Ṛgveda Varuṇa hymns"]

  - id: surya
    label: "Sūrya"
    kind: principle
    cluster: vedic
    role: clock
    description: >
      Sun that travels the ṛta-path. Seven bay steeds draw the car
      (Ṛgveda 1.50.8–9). Daily light, not a dying-and-rowed Re
      and not Timaean numbered heavens.
    refs: ["Ṛgveda 1.50.8–9"]

  - id: tvastr
    label: "Tvaṣṭṛ"
    kind: principle
    cluster: vedic
    role: controller
    description: >
      Divine smith. Shapes forms, the vajra, and living beings. Vedic
      craftsman of tools and bodies, not of the whole cosmos from a model.
    refs: ["Ṛgveda Tvaṣṭṛ passages"]

  - id: dyaus
    label: "Dyaus"
    kind: principle
    cluster: vedic
    description: >
      Sky father, often with Pṛthivī. Cognate with Zeus/Jupiter as a name,
      not as the later Olympian king. Summit-as-sky.
    refs: ["Ṛgveda Dyaus-Pṛthivī hymns"]

  - id: prithivi
    label: "Pṛthivī"
    kind: principle
    cluster: vedic
    description: >
      Earth mother, pair of Dyaus. Broad earth, not chōra and not Geb’s
      Ennead genealogy.
    refs: ["Ṛgveda Dyaus-Pṛthivī hymns"]

  - id: rudra
    label: "Rudra"
    kind: principle
    cluster: vedic
    description: >
      Vedic howler and archer (RV 2.33). Feared healer at the edge of the
      hymn-pantheon. Later the tamas name of the trimūrti destroyer. Not the
      Maruts as a set and not every Śaiva epithet.
    refs:
      - "Ṛgveda 2.33"
      - "Ṛgveda 1.114"
      - "Maitrī Upaniṣad 5.2"
      - "Macdonell, Vedic Mythology"

  - id: el-canaanite
    label: "El"
    kind: principle
    cluster: canaanite
    role: attractor
    description: >
      Aged high god of Ugarit. Father of gods, bull, cosmic mountain. Sovereign
      who grants kingship rather than fighting Yam himself. Summit slot; not
      Israel’s El as a node.
    refs: ["Baal Cycle", "KTU 1.1–1.6"]

  - id: yam
    label: "Yam"
    kind: principle
    cluster: canaanite
    role: noise
    description: >
      Sea and river (Nahar). Baal’s first opponent. Chaos-water that can be
      defeated and bound, not cut into heaven and earth.
    refs: ["KTU 1.2", "Smith, The Ugaritic Baal Cycle"]

  - id: baal
    label: "Baal"
    kind: principle
    cluster: canaanite
    role: governor
    description: >
      Storm, rain, Cloud-Rider. Defeats Yam, dies into Mot, returns. King under
      El, not the highest. Seasonal death-and-return, not escape from the cosmos.
    refs: ["KTU 1.1–1.6", "Baal Cycle"]

  - id: mot
    label: "Mot"
    kind: principle
    cluster: canaanite
    role: prison
    description: >
      Death. Swallows Baal; a lip to earth and a lip to heaven. Fall as a god,
      not as a first water.
    refs: ["KTU 1.4–1.6"]

  - id: anat
    label: "Anat"
    kind: principle
    cluster: canaanite
    role: negative-feedback
    description: >
      Warrior sister of Baal. Hunts Mot and helps the return. Gathering by
      violence, not by weaving pieces like Isis.
    refs: ["KTU 1.6"]

  - id: kothar
    label: "Kothar-wa-Khasis"
    kind: principle
    cluster: canaanite
    role: controller
    description: >
      Divine craftsman. Makes Baal’s maces against Yam and builds Baal’s palace.
      Artisan of tools and house, not of the cosmos from a corpse.
    refs: ["KTU 1.2", "KTU 1.4"]

  - id: tian
    label: "Tian"
    kind: principle
    cluster: chinese
    role: attractor
    description: >
      Zhou Heaven: lofty order that sees as the people see and backs virtue.
      Summit without a craftsman. Shang Di is the earlier high-god name, not
      a second node.
    refs:
      - "Shangshu, Taishi / Cai Zhong zhi ming"
      - "Shijing, Wenwang (tianming mi chang)"

  - id: tianming
    label: "Tianming"
    kind: principle
    cluster: chinese
    role: governor
    description: >
      Mandate of Heaven. Rule is lent and can be withdrawn. Political-cosmic
      feedback, not a once-given covenant and not a fallen time.
    refs:
      - "Shangshu (tianming)"
      - "Shijing, Wenwang"

  - id: dao
    label: "Dao"
    kind: principle
    cluster: chinese
    role: attractor
    description: >
      Nameless origin before heaven and earth (DDJ 1, 25). Produces One, Two,
      Three, the ten thousand things (DDJ 42). Returns. Not a craftsman and
      not a personal creator.
    refs:
      - "Daodejing 1"
      - "Daodejing 25"
      - "Daodejing 42"
      - "Daodejing 51"

  - id: yijing-change
    label: "Yijing Change"
    kind: principle
    cluster: chinese
    role: clock
    description: >
      One yin and one yang is called Dao; production and reproduction is called
      Change (Xici I). Time as ceaseless pairing, not a moving image of eternity.
    refs:
      - "Yijing, Xici I (一陰一陽之謂道; 生生之謂易)"

  - id: ares
    label: "Ares"
    kind: principle
    cluster: hellenic
    role: noise
    description: >
      Greek war as strife. Zeus calls him most hateful of the Olympians,
      because strife, wars, and battles are dear to him. Not a founder and
      not the keeper of fields.
    refs:
      - "Homer, Iliad 5.890–891"

  - id: mars
    label: "Mars"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Roman Mars pater. In the field lustration he is asked to keep off
      disease and barrenness and to let grain and vines flourish. Battle
      is only part of the function.       Father of Romulus in the grove story
      is a separate claim and is not settled here as an older Italic origin.
    refs:
      - "Cato, De agri cultura 141"
      - "Dionysius of Halicarnassus, Roman Antiquities 1.77.1"
      - "Livy 22.10.9"

  - id: zeus
    label: "Zeus"
    kind: principle
    cluster: hellenic
    role: attractor
    description: >
      Greek sky sovereign of the twelve. This node is the name Jupiter
      translates. It is not the Platonic Zeus who divides the spherical humans.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: jupiter
    label: "Jupiter"
    kind: principle
    cluster: roman
    role: attractor
    description: >
      Heads the Roman twelve at the lectisternium of 217, and receives the
      vowed spring. Same sky-sovereign slot as Zeus in the sources opened
      here. A further state-oath function is not claimed as a separate swap.
    refs: ["Livy 22.10.2–3", "Livy 22.10.9"]

  - id: hera
    label: "Hera"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek consort in the twelve, the name Juno translates. Whether her
      function is only marriage is not re-opened here.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: juno
    label: "Juno"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Shares Jupiter’s couch at the lectisternium of 217. The name-match
      with Hera is recorded. A distinct Capitoline function is left open.
    refs: ["Livy 22.10.9"]

  - id: poseidon
    label: "Poseidon"
    kind: principle
    cluster: hellenic
    role: noise
    description: >
      Greek sea god of the twelve, the name Neptune translates. A Roman
      water-versus-sea gap is not claimed in this pass.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: neptune
    label: "Neptune"
    kind: principle
    cluster: roman
    role: noise
    description: >
      Named in the Roman twelve beside Minerva. Identified with Poseidon.
      No separate freshwater function is encoded until a passage is opened.
    refs: ["Livy 22.10.9"]

  - id: athena
    label: "Athena"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek armed city goddess and craft, the name Minerva translates.
      The war-and-craft split is not given its own edge in this pass.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: minerva
    label: "Minerva"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Named in the Roman twelve beside Neptune. Identified with Athena.
      An Etruscan Menrva origin is left open.
    refs: ["Livy 22.10.9"]

  - id: apollo
    label: "Apollo"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek Apollo, healer and singer. The Roman temple does not translate
      the name. It imports the cult.
    refs: ["Livy 4.25.3"]

  - id: roman-apollo
    label: "Roman Apollo"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Apollo Medicus. Temple vowed in 433 because of a plague and dedicated
      in 431. A foreign cult, outside the old Roman set, name untranslated.
    refs: ["Livy 4.25.3", "Livy 4.29.7", "Livy 22.10.9"]

  - id: artemis
    label: "Artemis"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek hunt and wild, the name Diana translates. An older woodland
      Diana is left open.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: diana
    label: "Diana"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Named in the Roman twelve beside Apollo. Identified with Artemis.
      No separate Aventine or Nemorensis function is encoded in this pass.
    refs: ["Livy 22.10.9"]

  - id: aphrodite
    label: "Aphrodite"
    kind: principle
    cluster: hellenic
    role: attractor
    description: >
      Greek desire in the twelve. The Roman vow of 217 is not her Cyprian cult
      under another name.
    refs: ["Livy 22.10.10"]

  - id: venus
    label: "Venus"
    kind: principle
    cluster: roman
    role: attractor
    description: >
      Venus Erycina. At the lectisternium of 217 a temple is vowed to her
      from the Sibylline books. An imported Sicilian cult, not a plain
      translation of Aphrodite.
    refs: ["Livy 22.10.9", "Livy 22.10.10"]

  - id: hephaestus
    label: "Hephaestus"
    kind: principle
    cluster: hellenic
    role: controller
    description: >
      Greek smith of the twelve, the name Vulcan translates. A Roman
      fire-of-the-city gap is not claimed until the Volcanalia is opened.
    refs: ["Livy 22.10.9 (Roman twelve; Greek name by interpretatio)"]

  - id: vulcan
    label: "Vulcan"
    kind: principle
    cluster: roman
    role: controller
    description: >
      Named in the Roman twelve beside Vesta. Identified with Hephaestus.
      The Volcanalia is left for a later pass.
    refs: ["Livy 22.10.9"]

  - id: hermes
    label: "Hermes"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek herald and guide. The Roman temple is not that office.
    refs: ["Livy 2.21.7", "Ovid, Fasti 5.669"]

  - id: mercury
    label: "Mercury"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Temple dedicated on the Ides of May, 495. The day is the merchants’
      festival. Gain and goods, not the herald’s staff. Later identified
      with Hermes. The fetials did not take up that staff.
    refs: ["Livy 2.21.7", "Ovid, Fasti 5.669–670"]

  - id: hestia
    label: "Hestia"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek household hearth. The Roman public flame is a different office.
    refs: ["Ovid, Fasti 6.295–298"]

  - id: vesta
    label: "Vesta"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Public hearth. The round temple holds an undying fire and no image
      of Vesta. Virgin ministers keep it. Named in the twelve beside Vulcan.
    refs: ["Ovid, Fasti 6.267–298", "Livy 22.10.9"]

  - id: demeter
    label: "Demeter"
    kind: principle
    cluster: hellenic
    role: governor
    description: >
      Greek grain, vowed at Rome together with Dionysus and Kore and
      dedicated under other names.
    refs: ["Dionysius of Halicarnassus, Roman Antiquities 6.17.2"]

  - id: ceres
    label: "Ceres"
    kind: principle
    cluster: roman
    role: governor
    description: >
      Roman grain in the plebeian temple with Liber and Libera. The vow
      named Demeter, Dionysus, and Kore. She is also the last couch of the
      twelve, beside Mercury.
    refs:
      - "Dionysius of Halicarnassus, Roman Antiquities 6.17.2"
      - "Livy 22.10.9"

  - id: dionysus
    label: "Dionysus"
    kind: principle
    cluster: hellenic
    role: noise
    description: >
      Greek wine and ecstasy, named in the vow that Rome paid as Liber.
    refs: ["Dionysius of Halicarnassus, Roman Antiquities 6.17.2"]

  - id: liber
    label: "Liber"
    kind: principle
    cluster: roman
    role: noise
    description: >
      Shares the Aventine temple with Ceres and Libera. The Greek vow said
      Dionysus. The Roman three are a plebeian cult, not a maenadic cycle.
    refs: ["Dionysius of Halicarnassus, Roman Antiquities 6.17.2"]

  - id: helios
    label: "Helios"
    kind: principle
    cluster: hellenic
    role: clock
    description: >
      Greek sun who drives a golden-yoked chariot and gazes as he goes
      (Homeric Hymn 31). He oversees all and hears all (Odyssey 12.320).
      Not Apollo, and not a covenant god.
    refs:
      - "Homeric Hymn 31.8–15"
      - "Homer, Odyssey 12.320"

  - id: mitra
    label: "Mitra"
    kind: principle
    cluster: vedic
    role: governor
    description: >
      Covenant. Speaking, he sets peoples in their agreements, sustains
      earth and heaven, and beholds the settlements with eyes that do not
      close (Ṛgveda 3.59.1). Not the sun in the car. Avestan Miθra and any
      solar parallel with Jesus stay open.
    refs: ["Ṛgveda 3.59.1"]
